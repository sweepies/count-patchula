# SPDX-License-Identifier: MIT
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - closed
jobs:
  cascade:
    runs-on: docker
    if: >
      ! contains(github.event.pull_request.title, '[skip cascade]')
    steps:
      - uses: https://data.forgejo.org/actions/cascading-pr@b52d5b1f4f7bc3dd8b9f6ceca3a05aea6e9920be # v2.3.2
        with:
          origin-url: ${{ env.GITHUB_SERVER_URL }}
          origin-repo: ${{ github.repository }}
          origin-token: ${{ secrets.CASCADING_PR_ORIGIN }}
          origin-pr: ${{ github.event.pull_request.number }}
          destination-url: ${{ env.GITHUB_SERVER_URL }}
          destination-repo: forgejo/end-to-end
          destination-fork-repo: cascading-pr/end-to-end
          destination-branch: main
          destination-token: ${{ secrets.CASCADING_PR_DESTINATION }}
          close: true
          update: .forgejo/cascading-pr-end-to-end
