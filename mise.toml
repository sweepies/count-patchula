[tools]
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt", mr_boxington = true }
mr-boxington = "1.24.0"
usage = "7.0.1"
tak = "0.0.15"
zig = "0.17.0"
# File tasks with real logic are nu scripts.
nu = "0.116.1"
node = "24.21.0"
go = "1.27.2"
# hk runs the linters in hk.pkl from the git hooks and from CI.
hk = "2.9.0"
pkl = "0.32.2"
jactionlint = "2.2.0"
betterleaks = "1.9.0"
zizmor = "1.31.1"
# nu-lint publishes Linux builds only, on Codeberg; macOS builds it from crates.io.
"forgejo:wvhulle/nu-lint" = { version = "1.7.1", api_url = "https://codeberg.org/api/v1", os = [
  "linux",
] }
"cargo:nu-lint" = { version = "1.7.1", os = ["macos"] }
# The DeepSource CLI, for the deepsource agent skill. Its current builds are
# published on cli.deepsource.com, not as GitHub releases.
"http:deepsource" = { version = "2.0.55", url = 'https://cli.deepsource.com/build/deepsource_{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.tar.gz' }

[env]
MBX_DISPLAY = "plain"
# Clippy, tests and builds share one target instead of duplicating a check lane.
MBX_TARGET_LANES = "0"
# Zig compiles and links native code on Linux; macOS keeps Apple's toolchain.
CC = "{% if os() == 'linux' %}{{config_root}}/mise-tasks/cc{% else %}cc{% endif %}"
AR = "{% if os() == 'linux' %}{{config_root}}/mise-tasks/ar{% else %}ar{% endif %}"

# Tasks short enough to write inline live in tasks.toml; longer ones are nu
# file tasks in mise-tasks/.
[task_config]
includes = ["tasks.toml", "mise-tasks"]
