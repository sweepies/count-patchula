[tools]
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt", mr_boxington = true }
mr-boxington = "1.24.0"
usage = "7.0.1"
tak = "0.0.15"
zig = "0.17.0"
bun = "1.4.3"
node = "24.21.0"
go = "1.27.2"

[env]
MBX_DISPLAY = "plain"
# CI checks run sequentially; share the target instead of duplicating a check lane.
MBX_TARGET_LANES = "0"
CC = "{{config_root}}/mise-tasks/cc"
AR = "{{config_root}}/mise-tasks/ar"

[tasks.build]
description = "Build the workspace through mbx"
run = "cargo build --workspace --locked"

[tasks."cache:doctor"]
description = "Inspect mbx toolchain, local store and remote configuration"
run = "mbx doctor"

[tasks."conformance:compare"]
description = "Compare Renovate JSON output with a versioned patchula report; forwards CLI arguments"
raw_args = true
run = "cargo run --quiet --locked -p patchula-conformance --"

[tasks."conformance:inspect"]
description = "Summarize triage buckets; optional manager argument prints representative differences"
raw_args = true
run = '''
bun -e '
const [path, manager, limit = "2"] = process.argv.slice(1);
const triage = await Bun.file(path).json();
const buckets = new Map();
for (const d of triage.differences) {
  const key = [d.repository, d.manager, d.classification, d.field].join(" / ");
  buckets.set(key, (buckets.get(key) ?? 0) + 1);
}
if (!manager) for (const [key, count] of [...buckets].sort()) console.log(`${count}\t${key}`);
if (manager === "warnings") {
  for (const r of triage.patchula.repositories) if (r.warnings?.length) console.log(JSON.stringify({repository:r.repository,warnings:r.warnings}));
} else if (manager) {
  const seen = new Map();
  for (const d of triage.differences.filter(d => d.manager === manager && d.classification !== "deliberate-departure")) {
    const key = [d.repository, d.classification, d.field].join("/");
    if ((seen.get(key) ?? 0) >= Number(limit)) continue;
    seen.set(key, (seen.get(key) ?? 0) + 1);
    const actual = triage.patchula.repositories.find(r => r.repository === d.repository)?.packageFiles
      .find(f => f.path === d.packageFile)?.dependencies.find(a => a.manager === d.manager && a.name === d.dependency);
    console.log(JSON.stringify({...d, heldBack: actual?.metadata?.heldBack}));
  }
}
' "$@"
'''

[tasks."conformance:logs"]
description = "Inspect output snapshot identities and skip reasons without reading upstream source"
raw_args = true
run = '''
bun -e '
const [path, repository, manager] = process.argv.slice(1);
for (const line of (await Bun.file(path).text()).split("\n")) {
  if (!line.startsWith("{")) continue;
  const r = JSON.parse(line);
  if (r.repository !== repository) continue;
  if (r.msg === "Repository finished") console.log(JSON.stringify({result:r.result,exitCode:r.exitCode}));
  if (r.msg !== "packageFiles with updates") continue;
  for (const [m, files] of Object.entries(r.config ?? r.packageFiles ?? {})) {
    if (manager && m !== manager) continue;
    for (const file of files) for (const d of file.deps) console.log(JSON.stringify({manager:m,file:file.packageFile,name:d.depName,package:d.packageName,source:d.datasource,current:d.currentValue,version:d.currentVersion,digest:d.currentDigest,skip:d.skipReason,updates:d.updates,registry:d.registryUrls}));
  }
}
' "$@"
'''

[tasks."benchmarks:build"]
description = "Build release subjects outside tak's measured commands"
run = ["cargo build --release --locked -p patchula-cli", "cargo build --release --locked -p patchula-github --example replay_bench"]

[tasks."benchmarks:run"]
description = "Report tak timings and optional instruction counts; accepts tak run flags"
depends = ["benchmarks:build"]
run = ["mkdir -p benchmark-results", "tak run --export-json benchmark-results/results.json > benchmark-results/summary.txt"]

[tasks."benchmarks:record"]
description = "Record report-only tak results in local git notes; never push"
depends = ["benchmarks:build"]
run = ["mkdir -p benchmark-results", "tak run --record --export-json benchmark-results/results.json > benchmark-results/summary.txt"]

[tasks."benchmarks:export"]
description = "Export local HEAD benchmark notes as a portable artifact"
run = ["mkdir -p benchmark-results", "tak artifact export --output benchmark-results/tak-artifact.json"]

[tasks.test]
description = "Test the workspace through mbx"
# Lockfile engines the offline real-tool tests run, matching
# crates/update/src/lockfiles/defaults.toml. Task-scoped so a development
# `mise install` does not fetch them.
tools = { aube = "2.8.1", yarn = "4.18.1", python = "3.14.8", uv = "0.13.1", poetry = "2.5.1", dotnet = "9.0.319", ruby = "3.4.11", "http:php[url=https://dl.static-php.dev/static-php-cli/common/php-{{version}}-cli-linux-x86_64.tar.gz]" = "8.5.8", "http:composer[url=https://getcomposer.org/download/{{version}}/composer.phar,bin=composer]" = "2.10.3" }
run = "cargo test --workspace --locked --no-fail-fast"

[tasks."test:stress"]
description = "Repeat the offline suite with varied test thread counts; logs stay outside the repository"
tools = { aube = "2.8.1", yarn = "4.18.1", python = "3.14.8", uv = "0.13.1", poetry = "2.5.1", dotnet = "9.0.319", ruby = "3.4.11", "http:php[url=https://dl.static-php.dev/static-php-cli/common/php-{{version}}-cli-linux-x86_64.tar.gz]" = "8.5.8", "http:composer[url=https://getcomposer.org/download/{{version}}/composer.phar,bin=composer]" = "2.10.3" }
env = { CARGO_NET_OFFLINE = "true", PATCHULA_RECORD = "0" }
run = '''
log_dir="${PATCHULA_STRESS_LOG_DIR:-/tmp/patchula-stress}"
mkdir -p "$log_dir"
for iteration in $(seq 1 "${PATCHULA_STRESS_RUNS:-12}"); do
  for threads in 1 2 16; do
    log="$log_dir/${iteration}-${threads}.log"
    if ! cargo test --workspace --locked -- --test-threads="$threads" "${PATCHULA_STRESS_FILTER:-}" > "$log" 2>&1; then
      cat "$log"
      exit 1
    fi
    echo "passed iteration=$iteration threads=$threads"
  done
done
'''

[tasks.lint]
description = "Check formatting and reject all Clippy warnings"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks.ci]
description = "Run the same checks locally and on GitHub"
env = { PATCHULA_RECORD = "0", CARGO_TERM_COLOR = "never" }
run = '''
log_dir="${PATCHULA_CI_LOG_DIR:-$(mktemp -d "${TMPDIR:-/tmp}/patchula-ci.XXXXXX")}"
mkdir -p "$log_dir"
echo "CI full logs: $log_dir"
for task in fixtures:check lint test build; do
  log="$log_dir/${task%%:*}.log"
  if mise run "$task" > "$log" 2>&1; then
    cat "$log"
  else
    cat "$log"
    failed_tests=$(awk '/^test .* \.\.\. FAILED$/ {sub(/^test /, ""); sub(/ \.\.\. FAILED$/, ""); printf "%s,", $0}' "$log")
    # Keep the path and test names even when a caller filters for test result:.
    echo "test result: FAILED; stage=$task; failing-tests=${failed_tests:-see-log}; full-log=$log"
    exit 1
  fi
done
'''

[tasks."fixtures:check"]
description = "Reject possible secrets in all HTTP cassettes"
run = "cargo run --quiet --locked -p patchula-testkit --bin fixtures -- fixtures"

[tasks."fixtures:record"]
description = "Opt in to live HTTP recording, then scan the resulting cassettes"
env = { PATCHULA_RECORD = "1" }
run = ["cargo test --workspace --locked", "mise run fixtures:check"]

[tasks."docs:cli"]
description = "Generate CLI Markdown, man page and bash/zsh/fish completions from usage derive"
run = '''
mkdir -p generated/completions
cargo run --quiet --locked -p patchula-cli -- __usage_spec__ > generated/patchula.usage.kdl
usage lint generated/patchula.usage.kdl
usage generate markdown --file generated/patchula.usage.kdl --out-file docs/reference/cli.md
usage generate manpage --file generated/patchula.usage.kdl --out-file generated/patchula.1
for shell in bash zsh fish; do
  usage generate completion "$shell" patchula --file generated/patchula.usage.kdl > "generated/completions/patchula.$shell"
done
'''

# The documentation site. Node and aube are task-scoped, like the test-only
# lockfile engines, so a development `mise install` does not fetch them.
[tasks."docs:install"]
description = "Install the documentation site's packages from its lockfile"
dir = "docs"
tools = { node = "24.21.0", aube = "2.8.1" }
run = "aube ci"

[tasks."docs:dev"]
description = "Serve the documentation site with live reload"
depends = ["docs:install"]
dir = "docs"
tools = { node = "24.21.0", aube = "2.8.1" }
run = "aube run dev"

[tasks."docs:build"]
description = "Build the documentation site into docs/.vitepress/dist"
depends = ["docs:install"]
dir = "docs"
tools = { node = "24.21.0", aube = "2.8.1" }
run = "aube run build"

[tasks."docs:deploy"]
description = "Deploy the built site to Cloudflare Workers; needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
depends = ["docs:build"]
dir = "docs"
tools = { node = "24.21.0", aube = "2.8.1" }
run = "aube exec wrangler deploy"

[tasks."docs:preview"]
description = "Upload the built site as a Cloudflare preview version under an alias, without deploying it"
depends = ["docs:build"]
dir = "docs"
tools = { node = "24.21.0", aube = "2.8.1" }
usage = 'arg "<alias>" help="Preview alias, such as pr-42 (lowercase letters, digits and dashes)"'
run = 'aube exec wrangler versions upload --preview-alias "${usage_alias?}" --message "Preview ${usage_alias?}"'

[tasks."corpus:snapshot"]
description = "Regenerate tests/corpus-extraction.tsv after an intended extraction change"
env = { PATCHULA_UPDATE_SNAPSHOT = "1" }
run = "cargo test --locked -p patchula-manager --test corpus"

[tasks."corpus:check"]
description = "Look up every corpus dependency against live registries and plan its branches without writing; needs a GitHub token; forwards run flags"
raw_args = true
run = "cargo run --release --locked -p patchula-cli -- run --dry-run --json --local tests/corpus"

[tasks.lookup]
description = "Run read-only lookup; forwards repository and lookup flags"
raw_args = true
run = "cargo run --quiet --locked -p patchula-cli -- lookup"

[tasks.run]
description = "Plan or apply dependency branches; forwards repositories and write flags"
raw_args = true
run = "cargo run --quiet --locked -p patchula-cli -- run"

[tasks.server]
description = "Run the API-only GitHub App server; accepts server flags"
raw_args = true
run = "cargo run --quiet --locked -p patchula-cli -- --server"

[tasks."server:schema"]
description = "Print the published operator settings schema"
run = "cargo run --quiet --locked -p patchula-cli -- config server-schema"

[tasks."server:replay"]
description = "Sign and deliver a saved webhook locally: PAYLOAD EVENT DELIVERY [URL]"
raw_args = true
run = '''
bun -e '
import { createHmac } from "node:crypto";
const [path, event, delivery, url = "http://127.0.0.1:8080/webhook"] = process.argv.slice(1);
if (!path || !event || !delivery) throw new Error("usage: mise run server:replay PAYLOAD EVENT DELIVERY [URL]");
const destination = new URL(url);
if (!["127.0.0.1", "localhost", "[::1]"].includes(destination.hostname)) throw new Error("replay target must be loopback");
const file = process.env.PATCHULA_WEBHOOK_SECRET_FILE;
const value = process.env.PATCHULA_WEBHOOK_SECRET;
if (file && value) throw new Error("choose a secret file or environment value");
const secret = (file ? await Bun.file(file).text() : value)?.replace(/[\r\n]+$/, "");
if (!secret) throw new Error("set PATCHULA_WEBHOOK_SECRET_FILE or PATCHULA_WEBHOOK_SECRET");
const body = new Uint8Array(await Bun.file(path).arrayBuffer());
const signature = "sha256=" + createHmac("sha256", secret).update(body).digest("hex");
const response = await fetch(destination, {method:"POST", body, redirect:"error", headers:{"content-type":"application/json", "x-hub-signature-256":signature, "x-github-event":event, "x-github-delivery":delivery}});
console.log(`HTTP ${response.status}`);
if (response.status !== (event === "ping" ? 200 : 202)) process.exitCode = 1;
' "$@"
'''

[tasks."lookup:release"]
description = "Run read-only lookup in release mode; forwards repository and lookup flags"
raw_args = true
run = "cargo run --release --quiet --locked -p patchula-cli -- lookup"

[tasks."benchmarks:lookup-release"]
description = "Measure release cold/warm source and engine fixtures offline"
run = ["cargo test --release --locked -p patchula-datasource --test recorded public_sources_cold_and_conditional_warm -- --nocapture", "cargo test --release --locked -p patchula-engine --test recorded -- --nocapture"]

[tasks."benchmarks:catalogs"]
description = "Replay four captured public npm documents offline; arguments: input-directory new-cache-path"
raw_args = true
env = { CARGO_NET_OFFLINE = "true" }
run = "cargo run --release --locked -p patchula-datasource --example catalog_bench --"

[tasks."registry:update"]
description = "Refresh backend identities from the installed mise published registry"
run = '''
mise registry --json | bun -e 'const entries = await Bun.stdin.json(); const registry = Object.fromEntries(entries.map(e => [e.short, e.backends])); process.stdout.write(JSON.stringify(registry, null, 2) + "\n")' > crates/mise/registry.json
'''

[tasks."fixtures:refresh-npm"]
description = "Record full public npm metadata in existing cassettes without GitHub credentials"
env = { PATCHULA_RECORD = "1" }
run = ["cargo test --locked -p patchula-datasource --test recorded refresh_public_npm_metadata -- --ignored", "mise run fixtures:check"]

[tasks."fixtures:record-wave1"]
description = "Record only Phase 1 public sources and multi-repo lookup fixtures"
env = { PATCHULA_RECORD = "1" }
run = ["cargo test --locked -p patchula-datasource --test recorded -- --nocapture", "cargo test --locked -p patchula-engine --test recorded -- --nocapture", "mise run fixtures:check"]

[tasks."benchmarks:lookup"]
description = "Measure cold/warm batch and source replay with fixed public cassettes"
run = ["cargo test --locked -p patchula-datasource --test recorded -- --nocapture", "cargo test --locked -p patchula-engine --test recorded -- --nocapture"]

[tasks."fixtures:record-wave2"]
description = "Record public registry v2, Terraform, PyPI and Helm fixtures"
env = { PATCHULA_RECORD = "1" }
run = ["cargo test --locked -p patchula-datasource --test wave2 -- --nocapture", "mise run fixtures:check"]

[tasks."benchmarks:wave2"]
description = "Replay wave 2 source fixtures in release mode"
run = "cargo test --release --locked -p patchula-datasource --test wave2 -- --nocapture"

[tasks."fixtures:record-engine"]
description = "Record the public multi-repository manager/engine fixture"
env = { PATCHULA_RECORD = "1" }
run = ["cargo test --locked -p patchula-engine --test recorded -- --nocapture", "mise run fixtures:check"]
