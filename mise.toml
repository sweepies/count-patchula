[tools]
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt", mr_boxington = true }
mr-boxington = "1.24.0"
usage = "7.0.1"
tak = "0.0.15"
zig = "0.17.0"
bun = "1.4.3"
node = "24.21.0"

[env]
MBX_DISPLAY = "plain"
# CI checks run sequentially; share the target instead of duplicating a check lane.
MBX_TARGET_LANES = "0"
CC = "{{config_root}}/mise-tasks/cc"
AR = "{{config_root}}/mise-tasks/ar"

[tasks.build]
description = "Build the workspace through mbx"
run = "cargo build --workspace --locked"

[tasks."cache:doctor"]
description = "Inspect mbx toolchain, local store and remote configuration"
run = "mbx doctor"

[tasks."conformance:compare"]
description = "Compare Renovate JSON output with a versioned rustovate report; forwards CLI arguments"
raw_args = true
run = "cargo run --quiet --locked -p rustovate-conformance --"

[tasks."conformance:inspect"]
description = "Summarize triage buckets; optional manager argument prints representative differences"
raw_args = true
run = '''
bun -e '
const [path, manager, limit = "2"] = process.argv.slice(1);
const triage = await Bun.file(path).json();
const buckets = new Map();
for (const d of triage.differences) {
  const key = [d.repository, d.manager, d.classification, d.field].join(" / ");
  buckets.set(key, (buckets.get(key) ?? 0) + 1);
}
if (!manager) for (const [key, count] of [...buckets].sort()) console.log(`${count}\t${key}`);
if (manager === "warnings") {
  for (const r of triage.rustovate.repositories) if (r.warnings?.length) console.log(JSON.stringify({repository:r.repository,warnings:r.warnings}));
} else if (manager) {
  const seen = new Map();
  for (const d of triage.differences.filter(d => d.manager === manager && d.classification !== "deliberate-departure")) {
    const key = [d.repository, d.classification, d.field].join("/");
    if ((seen.get(key) ?? 0) >= Number(limit)) continue;
    seen.set(key, (seen.get(key) ?? 0) + 1);
    const actual = triage.rustovate.repositories.find(r => r.repository === d.repository)?.packageFiles
      .find(f => f.path === d.packageFile)?.dependencies.find(a => a.manager === d.manager && a.name === d.dependency);
    console.log(JSON.stringify({...d, heldBack: actual?.metadata?.heldBack}));
  }
}
' "$@"
'''

[tasks."conformance:logs"]
description = "Inspect output snapshot identities and skip reasons without reading upstream source"
raw_args = true
run = '''
bun -e '
const [path, repository, manager] = process.argv.slice(1);
for (const line of (await Bun.file(path).text()).split("\n")) {
  if (!line.startsWith("{")) continue;
  const r = JSON.parse(line);
  if (r.repository !== repository) continue;
  if (r.msg === "Repository finished") console.log(JSON.stringify({result:r.result,exitCode:r.exitCode}));
  if (r.msg !== "packageFiles with updates") continue;
  for (const [m, files] of Object.entries(r.config ?? r.packageFiles ?? {})) {
    if (manager && m !== manager) continue;
    for (const file of files) for (const d of file.deps) console.log(JSON.stringify({manager:m,file:file.packageFile,name:d.depName,package:d.packageName,source:d.datasource,current:d.currentValue,version:d.currentVersion,digest:d.currentDigest,skip:d.skipReason,updates:d.updates,registry:d.registryUrls}));
  }
}
' "$@"
'''

[tasks."benchmarks:build"]
description = "Build release subjects outside tak's measured commands"
run = ["cargo build --release --locked -p rustovate-cli", "cargo build --release --locked -p rustovate-github --example replay_bench"]

[tasks."benchmarks:run"]
description = "Report tak timings and optional instruction counts; accepts tak run flags"
depends = ["benchmarks:build"]
run = ["mkdir -p benchmark-results", "tak run --export-json benchmark-results/results.json > benchmark-results/summary.txt"]

[tasks."benchmarks:record"]
description = "Record report-only tak results in local git notes; never push"
depends = ["benchmarks:build"]
run = ["mkdir -p benchmark-results", "tak run --record --export-json benchmark-results/results.json > benchmark-results/summary.txt"]

[tasks."benchmarks:export"]
description = "Export local HEAD benchmark notes as a portable artifact"
run = ["mkdir -p benchmark-results", "tak artifact export --output benchmark-results/tak-artifact.json"]

[tasks.test]
description = "Test the workspace through mbx"
run = "cargo test --workspace --locked"

[tasks.lint]
description = "Check formatting and reject all Clippy warnings"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks.ci]
description = "Run the same checks locally and on GitHub"
run = ["mise run fixtures:check", "mise run lint", "mise run test", "mise run build"]

[tasks."fixtures:check"]
description = "Reject possible secrets in all HTTP cassettes"
run = "cargo run --quiet --locked -p rustovate-testkit --bin fixtures -- fixtures"

[tasks."fixtures:record"]
description = "Opt in to live HTTP recording, then scan the resulting cassettes"
env = { RUSTOVATE_RECORD = "1" }
run = ["cargo test --workspace --locked", "mise run fixtures:check"]

[tasks.docs]
description = "Generate CLI Markdown, man page and bash/zsh/fish completions from usage derive"
run = '''
mkdir -p generated/completions
cargo run --quiet --locked -p rustovate-cli -- __usage_spec__ > generated/rustovate.usage.kdl
usage lint generated/rustovate.usage.kdl
usage generate markdown --file generated/rustovate.usage.kdl --out-file docs/cli.md
usage generate manpage --file generated/rustovate.usage.kdl --out-file generated/rustovate.1
for shell in bash zsh fish; do
  usage generate completion "$shell" rustovate --file generated/rustovate.usage.kdl > "generated/completions/rustovate.$shell"
done
'''

[tasks.lookup]
description = "Run read-only lookup; forwards repository and lookup flags"
raw_args = true
run = "cargo run --quiet --locked -p rustovate-cli -- lookup"

[tasks."lookup:release"]
description = "Run read-only lookup in release mode; forwards repository and lookup flags"
raw_args = true
run = "cargo run --release --quiet --locked -p rustovate-cli -- lookup"

[tasks."benchmarks:lookup-release"]
description = "Measure release cold/warm source and engine fixtures offline"
run = ["cargo test --release --locked -p rustovate-datasource --test recorded public_sources_cold_and_conditional_warm -- --nocapture", "cargo test --release --locked -p rustovate-engine --test recorded -- --nocapture"]

[tasks."benchmarks:catalogs"]
description = "Replay four captured public npm documents offline; arguments: input-directory new-cache-path"
raw_args = true
env = { CARGO_NET_OFFLINE = "true" }
run = "cargo run --release --locked -p rustovate-datasource --example catalog_bench --"

[tasks."registry:update"]
description = "Refresh backend identities from the installed mise published registry"
run = '''
mise registry --json | bun -e 'const entries = await Bun.stdin.json(); const registry = Object.fromEntries(entries.map(e => [e.short, e.backends])); process.stdout.write(JSON.stringify(registry, null, 2) + "\n")' > crates/mise/registry.json
'''

[tasks."fixtures:refresh-npm"]
description = "Record full public npm metadata in existing cassettes without GitHub credentials"
env = { RUSTOVATE_RECORD = "1" }
run = ["cargo test --locked -p rustovate-datasource --test recorded refresh_public_npm_metadata -- --ignored", "mise run fixtures:check"]

[tasks."fixtures:record-wave1"]
description = "Record only Phase 1 public sources and multi-repo lookup fixtures"
env = { RUSTOVATE_RECORD = "1" }
run = ["cargo test --locked -p rustovate-datasource --test recorded -- --nocapture", "cargo test --locked -p rustovate-engine --test recorded -- --nocapture", "mise run fixtures:check"]

[tasks."benchmarks:lookup"]
description = "Measure cold/warm batch and source replay with fixed public cassettes"
run = ["cargo test --locked -p rustovate-datasource --test recorded -- --nocapture", "cargo test --locked -p rustovate-engine --test recorded -- --nocapture"]

[tasks."fixtures:record-wave2"]
description = "Record public registry v2, Terraform, PyPI and Helm fixtures"
env = { RUSTOVATE_RECORD = "1" }
run = ["cargo test --locked -p rustovate-datasource --test wave2 -- --nocapture", "mise run fixtures:check"]

[tasks."benchmarks:wave2"]
description = "Replay wave 2 source fixtures in release mode"
run = "cargo test --release --locked -p rustovate-datasource --test wave2 -- --nocapture"

[tasks."fixtures:record-engine"]
description = "Record the public multi-repository manager/engine fixture"
env = { RUSTOVATE_RECORD = "1" }
run = ["cargo test --locked -p rustovate-engine --test recorded -- --nocapture", "mise run fixtures:check"]
