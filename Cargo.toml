[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/sweepies/count-patchula"
# The binaries ship from release.yml; no crate goes to crates.io.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "zstd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Tests inherit dev. Keep workspace backtrace locations without full type/variable
# information in every test binary and portable cache object.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# Release binaries trade build time for speed: LTO across the workspace and its
# dependencies, with one codegen unit per crate.
[profile.release]
lto = "fat"
codegen-units = 1
