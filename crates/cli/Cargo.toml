[package]
name = "rustovate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "rustovate"
path = "src/main.rs"

[dependencies]
rustovate-config = { path = "../config" }
usage-rs = "7.0.1"
serde_json = "1"
miette = { version = "7", features = ["fancy-no-backtrace"] }
rustovate-engine = { version = "0.1.0", path = "../engine" }
rustovate-cache = { version = "0.1.0", path = "../cache" }
rustovate-http = { version = "0.1.0", path = "../http" }
rustovate-report = { version = "0.1.0", path = "../report" }
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

[dev-dependencies]
tempfile = "3"
