[package]
name = "patchula-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "patchula"
path = "src/main.rs"

[dependencies]
patchula-config = { path = "../config" }
patchula-server = { path = "../server" }
usage-rs = "7.0.1"
serde_json = "1"
serde.workspace = true
reqwest.workspace = true
miette = { version = "7", features = ["fancy-no-backtrace"] }
patchula-engine = { version = "0.5.0", path = "../engine" }
patchula-cache = { version = "0.5.0", path = "../cache" }
patchula-http = { version = "0.5.0", path = "../http" }
patchula-process = { path = "../process" }
patchula-report = { version = "0.5.0", path = "../report" }
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "json"] }
patchula-update = { path = "../update" }
patchula-manager = { path = "../manager" }
ratatui = "0.30.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clx = "3.0.5"
console = "0.16.6"
textwrap = "0.16.4"

[dev-dependencies]
patchula-testkit = { path = "../testkit" }
tempfile = "3"
base64 = "0.22"
sha2 = "0.11.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["test-util"] }
