[package]
name = "rustovate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "rustovate"
path = "src/main.rs"

[dependencies]
rustovate-config = { path = "../config" }
usage-rs = "7.0.1"
serde_json = "1"
miette = { version = "7", features = ["fancy-no-backtrace"] }

[dev-dependencies]
tempfile = "3"
