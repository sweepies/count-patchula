[package]
name = "patchula-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Reads and constructors only tests use.
testing = []

[dependencies]
patchula-cache = { path = "../cache" }
patchula-config = { path = "../config" }
patchula-http = { path = "../http" }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
thiserror.workspace = true
sha2 = "0.11.1"
sha1 = "0.11"
base64 = "0.23"
futures-util = "0.3"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs", "use_pem"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"

[dev-dependencies]
aws-lc-rs = "1"
patchula-github = { path = ".", features = ["testing"] }
patchula-testkit = { path = "../testkit" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
