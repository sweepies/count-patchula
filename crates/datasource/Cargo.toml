[package]
name = "patchula-datasource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
libyaml-safer = "0.3.0"
patchula-mise = { path = "../mise" }
reqwest.workspace = true
patchula-cache = { path = "../cache" }
patchula-config = { path = "../config" }
patchula-github = { path = "../github" }
patchula-http = { path = "../http" }
patchula-words = { path = "../words" }
patchula-versioning = { path = "../versioning" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio.workspace = true
futures-util = "0.3"
graphql_client = { version = "0.16", default-features = false, features = ["graphql_query_derive"] }

[dev-dependencies]
patchula-process = { path = "../process" }
patchula-testkit = { path = "../testkit" }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
