[package]
name = "patchula-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
# The token and transport constructors the engine's own tests build with.
testing = []
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
patchula-cache = { path = "../cache" }
patchula-config = { path = "../config" }
patchula-http = { path = "../http" }
patchula-github = { path = "../github" }
patchula-manager = { path = "../manager" }
patchula-datasource = { path = "../datasource" }
patchula-notes = { path = "../notes" }
patchula-lookup = { path = "../lookup" }
patchula-report = { path = "../report" }
patchula-update = { path = "../update" }
patchula-tools = { path = "../tools" }
patchula-versioning = { path = "../versioning" }
patchula-words = { path = "../words" }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
futures-util = "0.3"
futures-executor = "0.3"
graphql_client = { version = "0.16", default-features = false, features = ["graphql_query_derive"] }
base64 = "0.23"
[dev-dependencies]
patchula-update = { path = "../update", features = ["testing"] }
patchula-engine = { path = ".", features = ["testing"] }
patchula-cache = { path = "../cache", features = ["paused-clock"] }
sha2 = "0.11.1"
tokio = { workspace = true, features = ["test-util"] }
patchula-process = { path = "../process" }
patchula-testkit = { path = "../testkit" }
tempfile = "3"
