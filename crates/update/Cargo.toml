[package]
name = "patchula-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
patchula-notes = { path = "../notes" }
patchula-cache = { path = "../cache" }
patchula-config = { path = "../config" }
patchula-manager = { path = "../manager" }
patchula-github = { path = "../github" }
patchula-report = { path = "../report" }
patchula-versioning = { path = "../versioning" }
patchula-lookup = { path = "../lookup" }
patchula-lockfiles = { path = "../lockfiles" }
futures-util = "0.3"
graphql_client = { version = "0.16", default-features = false, features = ["graphql_query_derive"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
serde_yaml_ng = "0.10.0"
globset = "0.4"
base64 = "0.23"
tracing = "0.1"
thiserror.workspace = true
patchula-process = { path = "../process" }
patchula-words = { path = "../words" }

[dev-dependencies]
patchula-update = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
patchula-http = { path = "../http" }
patchula-datasource = { path = "../datasource" }
patchula-testkit = { path = "../testkit" }
tempfile = "3"
