[package]
name = "rustovate-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustovate-datasource = { path = "../datasource" }
rustovate-cache = { path = "../cache" }
rustovate-config = { path = "../config" }
rustovate-manager = { path = "../manager" }
rustovate-github = { path = "../github" }
rustovate-report = { path = "../report" }
rustovate-versioning = { path = "../versioning" }
rustovate-lookup = { path = "../lookup" }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sha1 = "0.11"
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.17"
tokio = { workspace = true, features = ["process", "io-util"] }
tempfile = "3"
toml_edit = "0.25.17"
serde_yaml_ng = "0.10.0"
rustix = { version = "1", features = ["process"] }
base64 = "0.22"
tracing = "0.1"
rustovate-http = { path = "../http" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rustovate-http = { path = "../http" }
