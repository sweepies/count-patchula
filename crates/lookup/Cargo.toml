[package]
name = "patchula-lookup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1.13.1"
patchula-config = { path = "../config" }
patchula-datasource = { path = "../datasource" }
patchula-manager = { path = "../manager" }
patchula-report = { path = "../report" }
patchula-words = { path = "../words" }
patchula-versioning = { path = "../versioning" }
semver = "1.0.28"

[dev-dependencies]
patchula-manager = { path = "../manager", features = ["testing"] }
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
patchula-cache = { path = "../cache" }
patchula-github = { path = "../github" }
patchula-http = { path = "../http" }
patchula-lockfiles = { path = "../lockfiles" }
patchula-testkit = { path = "../testkit" }
