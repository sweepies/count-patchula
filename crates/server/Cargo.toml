[package]
name = "patchula-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
patchula-cache = { path = "../cache" }
patchula-config = { path = "../config" }
patchula-engine = { path = "../engine" }
patchula-github = { path = "../github" }
patchula-http = { path = "../http" }
patchula-report = { path = "../report" }
patchula-update = { path = "../update" }
tokio = { workspace = true, features = ["net", "signal"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
axum = "0.8"
hmac = "0.13"
sha2 = "0.11.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.17"
tracing = "0.1"
futures-util = "0.3"
miette = { version = "7", features = ["fancy-no-backtrace"] }
serde_path_to_error = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"] }
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30", features = ["signal", "process"] }
