#:schema https://tak.jdx.dev/schema/tak.json
# Report-only. Build release binaries with mise run benchmarks:build first.
[defaults]
runs = 10
warmup = 2

[bench.startup]
cmd = ["./target/release/patchula", "--version"]

[bench.config-terraform-ignore]
cmd = ["./target/release/patchula", "config", "check", "examples/terraform-ignore.pkl"]

[bench.config-defaults]
cmd = ["./target/release/patchula", "config", "check", "examples/defaults.pkl"]

[bench.config-preserve-ranges]
cmd = ["./target/release/patchula", "config", "check", "examples/preserve-ranges.pkl"]

[bench.config-custom-extractor]
cmd = ["./target/release/patchula", "config", "check", "examples/custom-extractor.pkl"]

[bench.config-go-module]
cmd = ["./target/release/patchula", "config", "check", "examples/go-module.pkl"]

[bench.config-kubernetes-infra]
cmd = ["./target/release/patchula", "config", "check", "examples/kubernetes-infra.pkl"]

[bench.config-disabled-dependency]
cmd = ["./target/release/patchula", "config", "check", "examples/disabled-dependency.pkl"]

[bench.config-nightly-pins]
cmd = ["./target/release/patchula", "config", "check", "examples/nightly-pins.pkl"]

[bench.config-npm-only]
cmd = ["./target/release/patchula", "config", "check", "examples/npm-only.pkl"]

[bench.config-renovate-migration]
cmd = ["./target/release/patchula", "config", "check", "examples/renovate-migration.pkl"]

[bench.config-manual-merges]
cmd = ["./target/release/patchula", "config", "check", "examples/manual-merges.pkl"]

[bench.github-cache-replay]
cmd = ["./target/release/examples/replay_bench"]
# The worker's thread scheduling and SQLite I/O make counters noisy; this is
# end-to-end offline wall time, including temp DB and replay fixture setup.
counters = false
