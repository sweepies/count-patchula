name: Docs preview

# Each PR that touches the site gets its own Cloudflare preview URL, updated on
# every push. Production deploys happen from main in ci.yml.
on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-preview.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      # Fork PRs receive no secrets; they build but do not upload.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: true
      - name: Build and upload the preview
        id: upload
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          mise run docs:preview "$ALIAS"
          url=$(mise exec jq@1.8.2 -- jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Build only
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: mise run docs:build
      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- patchula-docs-preview -->'
          body=$(printf '%s\nThe Count has prepared a preview of the docs: %s\n\nBuilt from %s.\n' "$marker" "$URL" "$SHA")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
