name: Release

# One run makes a release: run it from the Actions tab, or with
# `gh workflow run release.yml -f version=X.Y.Z`. It checks main's commit
# passed CI, bumps the version in the runner, builds static archives, checks
# each one runs on its own platform, builds and pushes the server image, and
# only then pushes the bump commit to main, tags it and publishes the GitHub
# release with a signed packslip manifest and communique's notes. A dry run
# does all of the building and checking and pushes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.5.1, without the v
        required: true
        type: string
      dry_run:
        description: Build and check everything, but push, tag and publish nothing
        type: boolean
        default: false

permissions:
  contents: read

# bash, rather than the default "bash -e", also sets pipefail.
defaults:
  run:
    shell: bash

# One release at a time, and a started release always finishes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the CI result check run.
      checks: read
    steps:
      - name: Check the version and the commit's CI result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # SemVer 2.0 without build metadata.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::$VERSION is not a version such as 0.5.1"
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release runs from main; $GITHUB_REF can only dry-run"
            exit 1
          fi

          # Whether $1 is a later version than $2: the X.Y.Z parts by number,
          # and a release after its own prereleases.
          later() {
            local a=${1%%-*} b=${2%%-*}
            if [ "$a" != "$b" ]; then
              [ "$(printf '%s\n' "$a" "$b" | sort -V | tail -n 1)" = "$a" ]
            elif [ "$1" = "$a" ]; then
              [ "$2" != "$b" ]
            else
              [ "$2" != "$b" ] && [ "$1" != "$2" ] && [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]
            fi
          }
          latest=
          while IFS= read -r tag; do
            tag=${tag#v}
            if [ -z "$latest" ] || later "$tag" "$latest"; then
              latest=$tag
            fi
          done < <(gh api "repos/$REPO/tags" --paginate --jq '.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))')
          if [ "$latest" = "$VERSION" ]; then
            echo "::error::v$VERSION is already tagged"
            exit 1
          fi
          if [ -n "$latest" ] && ! later "$VERSION" "$latest"; then
            echo "::error::$VERSION is not later than the latest release, $latest"
            exit 1
          fi

          # CI's own check run, not one with the same name from another app.
          result=$(gh api "repos/$REPO/commits/$GITHUB_SHA/check-runs?check_name=CI%20result&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | first | .conclusion // "missing"')
          if [ "$result" != success ]; then
            echo "::error::CI result for $GITHUB_SHA is $result, not success"
            exit 1
          fi
          {
            echo "Releasing $VERSION from $GITHUB_REF at $GITHUB_SHA, after ${latest:-no earlier release}."
            echo "CI result: $result. Dry run: $DRY_RUN."
          } >> "$GITHUB_STEP_SUMMARY"

  # The bump commit is made once, here, and carried to every later job in a
  # bundle, so each one builds and pushes the same commit.
  bump:
    name: Bump
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: mise run release:bump "$VERSION"
      # CI already passed for the parent, so the commit may change only
      # versions and the files generated from them. The land job vouches
      # for it to main's required check on that basis.
      - name: Commit
        id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add --all
          unexpected=$(git diff --cached --name-only | grep -vE '^(Cargo\.toml|Cargo\.lock|crates/[^/]+/Cargo\.toml|conformance/Cargo\.toml|crates/cli/tests/help\.txt|README\.md|docs/src/content/docs/.*\.mdx?)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The bump changed files other than versions and generated files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "chore: $VERSION"
          git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..HEAD"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo '### Bump commit'
            echo '```'
            git show --stat --format='%H%n%s' HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bump
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: bump
    strategy:
      fail-fast: true
      matrix:
        include:
          # The first target of each runs on the runner itself, so it can
          # generate the man page and completions.
          - name: Linux
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - name: macOS
            runner: macos-26
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bump
          path: ${{ runner.temp }}/bump
      - name: Check out the bump commit
        env:
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          git fetch --quiet --no-tags "$RUNNER_TEMP/bump/release.bundle" HEAD
          git checkout --quiet --detach "$SHA"
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Check the crate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | mise exec jq@1.8.2 -- jq -r '.packages[] | select(.name == "patchula-cli") | .version')
          if [ "$VERSION" != "$version" ]; then
            echo "patchula-cli is $version, not $VERSION" >&2
            exit 1
          fi
      - name: Package
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          mise run release:package $TARGETS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: target/dist/*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux-x64-musl
            runner: ubuntu-latest
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-26
          - platform: darwin-x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Run the binary
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir smoke
          tar -xzf dist/patchula-v*-"$PLATFORM".tar.gz -C smoke
          smoke/bin/patchula --version | grep -Fx "patchula $VERSION"
          smoke/bin/patchula config check --help > /dev/null

  image:
    name: Container image
    needs: [bump, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Logs in to GHCR and pushes the image.
      packages: write
    env:
      IMAGE: ghcr.io/sweepies/count-patchula
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-Linux
          path: dist
      - name: Read the version from the archives
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          archives=(dist/patchula-v*-linux-x64-musl.tar.gz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "Expected one linux-x64-musl archive in dist, found: ${archives[*]}" >&2
            exit 1
          fi
          version=${archives[0]##*/patchula-v}
          version=${version%-linux-x64-musl.tar.gz}
          if [ "$VERSION" != "$version" ]; then
            echo "The archives are $version, not $VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # A release is X.Y.Z and latest, with no floating minor or major tags,
          # and a prerelease never takes latest. A dry run builds the same
          # labels, which the smoke test checks, and pushes nothing. GHCR reads
          # a multi-platform image's description from its index annotations, so
          # the annotations repeat the labels.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=Count Patchula
            org.opencontainers.image.description=The Count's GitHub App server: patchula serve, with mise and git for lockfile updates
            org.opencontainers.image.source=https://github.com/sweepies/count-patchula
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.bump.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=Count Patchula
            org.opencontainers.image.description=The Count's GitHub App server: patchula serve, with mise and git for lockfile updates
            org.opencontainers.image.source=https://github.com/sweepies/count-patchula
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.bump.outputs.sha }}
      # Each platform is built and run before anything is pushed. The images
      # load into the local Docker, which cannot hold attestations, so they have
      # none; the pushed image has them.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: patchula:smoke
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: patchula:smoke-arm64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      # The server asks GitHub who its App is before it listens, and the API's
      # address is fixed, so a throwaway App needs a stand-in GitHub: openssl
      # serves one answer for api.github.com under a CA that only this container
      # trusts.
      - name: Run the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ needs.bump.outputs.sha }}
        run: |
          set -u
          image=patchula:smoke
          name=patchula-smoke
          work=$(mktemp -d)
          server=
          finish() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$name" >&2 || true
            fi
            docker rm --force "$name" > /dev/null 2>&1 || true
            if [ -n "$server" ]; then
              sudo kill "$server" || true
            fi
            exit "$status"
          }
          trap finish EXIT

          # The user, the tools and the labels.
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          docker run --rm "$image" --version | grep -Fx "patchula $VERSION"
          docker run --rm --entrypoint mise "$image" --version
          docker run --rm --entrypoint git "$image" --version
          docker run --rm "$image" config check-server /etc/patchula/server.pkl
          for label in "org.opencontainers.image.source=https://github.com/sweepies/count-patchula" \
            "org.opencontainers.image.version=$VERSION" \
            "org.opencontainers.image.revision=$REVISION" \
            "org.opencontainers.image.licenses=MIT"; do
            test "$(docker inspect --format "{{index .Config.Labels \"${label%%=*}\"}}" "$image")" = "${label#*=}"
          done

          # Throwaway credentials, and a stand-in for api.github.com.
          openssl genrsa -out "$work/app.pem" 2048
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$work/ca.key" -out "$work/ca.pem" -days 1 \
            -subj "/CN=patchula-smoke-ca" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign"
          openssl req -newkey rsa:2048 -nodes -keyout "$work/github.key" -out "$work/github.csr" -subj "/CN=api.github.com"
          printf 'subjectAltName=DNS:api.github.com\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$work/github.ext"
          openssl x509 -req -in "$work/github.csr" -CA "$work/ca.pem" -CAkey "$work/ca.key" -CAcreateserial -days 1 \
            -extfile "$work/github.ext" -out "$work/github.pem"
          mkdir "$work/www"
          printf '{"slug":"patchula-smoke","client_id":"smoke"}' > "$work/www/app"
          (cd "$work/www" && exec sudo openssl s_server -accept 443 -cert ../github.pem -key ../github.key -WWW -quiet) &
          server=$!
          PATCHULA_APP_PRIVATE_KEY=$(cat "$work/app.pem")
          PATCHULA_WEBHOOK_SECRET=$(openssl rand -hex 32)
          export PATCHULA_APP_PRIVATE_KEY PATCHULA_WEBHOOK_SECRET

          # A fresh named volume takes the image's ownership of /var/lib/patchula.
          docker run --detach --name "$name" \
            --add-host api.github.com:host-gateway \
            --publish 127.0.0.1:8080:8080 \
            --volume patchula-smoke-data:/var/lib/patchula \
            --volume "$work/ca.pem:/etc/smoke-ca.pem:ro" \
            --env SSL_CERT_FILE=/etc/smoke-ca.pem \
            --env PATCHULA_APP_ID=12345 \
            --env PATCHULA_APP_PRIVATE_KEY \
            --env PATCHULA_WEBHOOK_SECRET \
            "$image"
          for _ in $(seq 1 60); do
            if curl --silent --max-time 2 --output /dev/null http://127.0.0.1:8080/healthz; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then
              echo "The server exited before /healthz answered" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/healthz)" = 200
          docker exec "$name" test -f /var/lib/patchula/cache.sqlite
          # The image's own HEALTHCHECK command.
          docker exec "$name" sh -c "$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' "$image")"
      # QEMU runs the arm64 image, so this only checks that it starts.
      - name: Run the arm64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image=patchula:smoke-arm64
          docker run --rm --platform linux/arm64 "$image" --version | grep -Fx "patchula $VERSION"
          docker run --rm --platform linux/arm64 --entrypoint mise "$image" --version
          docker run --rm --platform linux/arm64 --entrypoint git "$image" --version
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # No layer cache is restored, like the archives, but the builder still
      # holds the layers it built above, so the platforms pushed are the ones
      # that ran. The attestations are BuildKit's: an SBOM from its Syft
      # scanner, and the build's provenance at mode=max, which also records the
      # Dockerfile, the base image digests and the archives' hashes.
      # The image goes up by digest alone. The land job tags it once the
      # commit and the tag are on main, so a release that fails to land
      # leaves only an untagged image behind.
      - name: Push the image
        id: push
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      - name: Check the pushed image
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          inspection=$(docker buildx imagetools inspect "$IMAGE@$DIGEST")
          printf '%s\n' "$inspection"
          grep -q 'Platform: *linux/amd64' <<< "$inspection"
          grep -q 'Platform: *linux/arm64' <<< "$inspection"

  # main requires a successful CI result check from GitHub Actions. The bump
  # commit's parent passed CI and the commit changes only versions and the
  # files generated from them, which this run has now built and tested, so
  # this job posts that check itself instead of running CI again. A push with
  # the built-in token starts no workflows, so nothing else runs on it either.
  land:
    name: Land
    needs: [bump, smoke, image]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the commit, the tag and a short-lived branch.
      contents: write
      # Posts the CI result check run.
      checks: write
      # Tags the pushed image.
      packages: write
    env:
      IMAGE: ghcr.io/sweepies/count-patchula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bump
          path: ${{ runner.temp }}/bump
      - name: Push the commit to main and tag it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.bump.outputs.sha }}
          VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch --quiet --no-tags "$RUNNER_TEMP/bump/release.bundle" HEAD
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A check run needs a commit GitHub has, so the commit goes to a
          # branch outside main's ruleset first.
          branch=release/v$VERSION
          git push --quiet origin "$SHA:refs/heads/$branch"
          trap 'git push --quiet origin --delete "$branch"' EXIT
          gh api "repos/$REPO/check-runs" --silent \
            -f name='CI result' -f head_sha="$SHA" -f status=completed -f conclusion=success \
            -f 'output[title]=Release bump' \
            -f "output[summary]=Only versions and generated files changed since $GITHUB_SHA, which passed CI. [The release run]($RUN_URL) built and tested this commit."
          git tag --annotate "v$VERSION" --message "v$VERSION" "$SHA"
          git push --quiet --atomic origin "$SHA:refs/heads/main" "refs/tags/v$VERSION"
          echo "Pushed $SHA to main as v$VERSION." >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A single index source is copied as it is, attestations and
      # annotations included.
      - name: Tag the image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          printf 'Tagged %s@%s as:\n%s\n' "$IMAGE" "$DIGEST" "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish
    needs: [bump, land]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: gh release create "$TAG" --draft --verify-tag --title "Count Patchula $TAG" --generate-notes dist/*
      - uses: jdx/packslip@7d397618045bd98b76cd5cb8177767b2f52789b8 # v1.10.1
        with:
          tag: v${{ inputs.version }}
          commit: ${{ needs.bump.outputs.sha }}
          artifacts: dist/*.tar.gz
          bin: patchula=bin/patchula
          resources: |
            man=archive:share/man/man1/patchula.1
            completion/bash=archive:share/bash-completion/completions/patchula
            completion/zsh=archive:share/zsh/site-functions/_patchula
            completion/fish=archive:share/fish/vendor_completions.d/patchula.fish
            cli-spec/usage=asset:dist/patchula.usage.kdl
            skill/patchula=repo:skills/patchula
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: gh release edit "$TAG" --draft=false
      # The Anthropic key lives in Infisical as anthropic-api-key (project
      # INFISICAL_PROJECT_ID, environment prod), read through GitHub OIDC by a
      # machine identity bound to main, the ref a release runs from. Until both
      # repository variables are set, the release keeps GitHub's generated notes.
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: anthropic-api-key
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Write the release notes
        if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        env:
          # Only the release tool, not the workspace toolchains.
          MISE_ENABLE_TOOLS: communique
          GITHUB_TOKEN: ${{ github.token }}
          # The action exports the secret under its Infisical name.
          ANTHROPIC_API_KEY: ${{ env['anthropic-api-key'] }}
          TAG: v${{ inputs.version }}
        run: mise run release:notes "$TAG"
