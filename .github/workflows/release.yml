name: Release

# Pushing a v* tag builds static archives, checks each one runs on its own
# platform, builds and pushes the server image from the Linux archives,
# publishes the GitHub release with a signed packslip manifest, then lets
# communique rewrite the notes. Only tags run it: pull requests don't build the
# release archives or the image.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - image/**
      - mise-tasks/image/**
      - .github/workflows/release.yml

permissions:
  contents: read

# bash, rather than the default "bash -e", also sets pipefail.
defaults:
  run:
    shell: bash

# A tag's release always finishes. A pull request's run only checks the image,
# so a newer push replaces it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        # A pull request only builds the Linux archives, which the image uses.
        name: ${{ fromJSON(github.event_name == 'push' && '["Linux", "macOS"]' || '["Linux"]') }}
    runs-on: ${{ matrix.name == 'Linux' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Check the tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | mise exec jq@1.8.2 -- jq -r '.packages[] | select(.name == "patchula-cli") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match patchula-cli $version" >&2
            exit 1
          fi
      # The first target of each runs on the runner itself, so it can generate
      # the man page and completions.
      - name: Package
        env:
          TARGETS: ${{ matrix.name == 'Linux' && 'x86_64-unknown-linux-musl aarch64-unknown-linux-musl' || 'aarch64-apple-darwin x86_64-apple-darwin' }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          mise run release:package $TARGETS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: target/dist/*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        platform: ${{ fromJSON(github.event_name == 'push' && '["linux-x64-musl", "linux-arm64-musl", "darwin-arm64", "darwin-x64"]' || '["linux-x64-musl", "linux-arm64-musl"]') }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64-musl": "ubuntu-latest", "linux-arm64-musl": "ubuntu-24.04-arm", "darwin-arm64": "macos-26", "darwin-x64": "macos-26-intel"}')[matrix.platform] }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Run the binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir smoke
          tar -xzf dist/patchula-v*-"$PLATFORM".tar.gz -C smoke
          smoke/bin/patchula --version | grep -E '^patchula [0-9]+\.[0-9]+\.[0-9]+'
          smoke/bin/patchula config check --help > /dev/null

  # Both platforms are built and smoke-tested before anything is pushed, and
  # the push must publish the very index that ran. Nothing runs under
  # emulation except melange's two copy steps and the arm64 image's quick
  # checks.
  image:
    name: Container image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Logs in to GHCR and pushes the image.
      packages: write
      # Signs and stores the image's provenance attestation.
      id-token: write
      attestations: write
    env:
      # Only nu and the image tools, not the workspace toolchains.
      MISE_ENABLE_TOOLS: nu,melange,apko
      # The image tasks install melange and apko themselves. Without this, mise
      # rewrites mise.lock after that install and spends 9 s re-locking every
      # tool for every platform.
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-Linux
          path: target/dist
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # A release never restores a cache, so nothing cached reaches the image.
          cache: false
          install_args: nu
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - run: mise run image:build
      # The first start installs mise through GitHub's API, which a token keeps
      # within its limits on a shared runner.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run image:smoke
      - run: mise run image:smoke --arch arm64
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        if: github.event_name == 'push'
        run: mise run image:push
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sweepies/count-patchula
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # apko's SBOM for each platform, attested to that platform's image.
      - if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/sweepies/count-patchula
          subject-digest: ${{ steps.push.outputs.amd64 }}
          sbom-path: target/image/sbom/sbom-x86_64.spdx.json
          push-to-registry: true
      - if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/sweepies/count-patchula
          subject-digest: ${{ steps.push.outputs.arm64 }}
          sbom-path: target/image/sbom/sbom-aarch64.spdx.json
          push-to-registry: true

  release:
    name: Publish
    needs: [smoke, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Count Patchula $GITHUB_REF_NAME" --generate-notes dist/*
      - uses: jdx/packslip@7d397618045bd98b76cd5cb8177767b2f52789b8 # v1.10.1
        with:
          artifacts: dist/*.tar.gz
          bin: patchula=bin/patchula
          resources: |
            man=archive:share/man/man1/patchula.1
            completion/bash=archive:share/bash-completion/completions/patchula
            completion/zsh=archive:share/zsh/site-functions/_patchula
            completion/fish=archive:share/fish/vendor_completions.d/patchula.fish
            cli-spec/usage=asset:dist/patchula.usage.kdl
            skill/patchula=repo:skills/patchula
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # The Anthropic key lives in Infisical as anthropic-api-key (project
      # INFISICAL_PROJECT_ID, environment prod), read through GitHub OIDC by a machine identity
      # bound to tag refs. Until both repository variables are set, the
      # release keeps GitHub's generated notes.
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: anthropic-api-key
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Write the release notes
        if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        env:
          # Only the release tool, not the workspace toolchains.
          MISE_ENABLE_TOOLS: communique
          GITHUB_TOKEN: ${{ github.token }}
          # The action exports the secret under its Infisical name.
          ANTHROPIC_API_KEY: ${{ env['anthropic-api-key'] }}
        run: mise run release:notes "$GITHUB_REF_NAME"
