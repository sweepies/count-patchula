name: Release

# Pushing a v* tag builds static archives, checks each one runs on its own
# platform, builds and pushes the server image from the Linux archives,
# publishes the GitHub release with a signed packslip manifest, then lets
# communique rewrite the notes. A pull request that changes the image or this
# workflow builds and checks the Linux archives and the image, with read-only
# permissions, and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - image/**
      - mise-tasks/image/**
      - mise-tasks/release/smoke
      - .github/workflows/release.yml

permissions:
  contents: read

# bash, rather than the default "bash -e", also sets pipefail.
defaults:
  run:
    shell: bash

# A tag's release always finishes. A pull request's run only checks the image,
# so a newer push replaces it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Install exactly what mise.lock records, never update it: a build fetches
  # only the tools it uses, so a download host for another tool cannot stall it.
  MISE_LOCKED: "1"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        # One job per target, so the targets build side by side, each on a
        # host that runs its binary to generate the man page and completions.
        # Intel Macs are not supported. A pull request only builds the Linux
        # archives, which the image uses.
        include: >-
          ${{ fromJSON(github.event_name == 'push' && '[
            {"platform": "linux-x64-musl", "target": "x86_64-unknown-linux-musl", "runner": "ubuntu-latest"},
            {"platform": "linux-arm64-musl", "target": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm"},
            {"platform": "darwin-arm64", "target": "aarch64-apple-darwin", "runner": "macos-26"}
          ]' || '[
            {"platform": "linux-x64-musl", "target": "x86_64-unknown-linux-musl", "runner": "ubuntu-latest"},
            {"platform": "linux-arm64-musl", "target": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm"}
          ]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Only what release:package uses, not the workspace's lint and test tools.
      MISE_ENABLE_TOOLS: rust,mr-boxington,zig,nu,usage
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Check the tag matches the crate version
        if: github.event_name == 'push'
        run: mise run release:check-tag "$GITHUB_REF_NAME"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: mise run release:package "$TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        platform: ${{ fromJSON(github.event_name == 'push' && '["linux-x64-musl", "linux-arm64-musl", "darwin-arm64"]' || '["linux-x64-musl", "linux-arm64-musl"]') }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64-musl": "ubuntu-latest", "linux-arm64-musl": "ubuntu-24.04-arm", "darwin-arm64": "macos-26"}')[matrix.platform] }}
    timeout-minutes: 10
    env:
      # Only the task runner, not the workspace toolchains.
      MISE_ENABLE_TOOLS: nu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - name: Run the binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: mise run release:smoke "$PLATFORM"

  # Both platforms are built and smoke-tested before anything is pushed, and
  # the push must publish the very index that ran. Nothing runs under
  # emulation except melange's two copy steps and the arm64 image's quick
  # checks. This job runs a pull request's code, so it holds no write
  # permissions; image-publish, which only tags run, pushes what it built.
  image:
    name: Container image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Only nu and the image tools, not the workspace toolchains.
      MISE_ENABLE_TOOLS: nu,melange,apko
      # The image tasks install melange and apko themselves. Without this, mise
      # rewrites mise.lock after that install and spends 9 s re-locking every
      # tool for every platform.
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          # Every job writes the same patchula.usage.kdl, so merging is safe.
          pattern: dist-linux-*
          merge-multiple: true
          path: target/dist
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # A release never restores a cache, so nothing cached reaches the image.
          cache: false
          install_args: nu
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - run: mise run image:build
      - run: mise run image:smoke
      - run: mise run image:smoke --arch arm64
      # What image:push needs to publish this exact index again: the index
      # the smoke test ran, the package cache and local packages it rebuilds
      # from, and apko's SBOMs.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image
          path: |
            target/image/image.tar
            target/image/apk-cache
            target/image/packages
            target/image/sbom
          if-no-files-found: error
          retention-days: 1

  image-publish:
    name: Publish the container image
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Logs in to GHCR and pushes the image.
      packages: write
      # Signs and stores the image's provenance attestation.
      id-token: write
      attestations: write
    env:
      # Only nu and apko, not the workspace toolchains.
      MISE_ENABLE_TOOLS: nu,apko
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: image
          path: target/image
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # A release never restores a cache, so nothing cached reaches the image.
          cache: false
          install_args: nu
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        run: mise run image:push
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/sweepies/count-patchula
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # apko's SBOM for each platform, attested to that platform's image.
      - uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ghcr.io/sweepies/count-patchula
          subject-digest: ${{ steps.push.outputs.amd64 }}
          sbom-path: target/image/sbom/sbom-x86_64.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ghcr.io/sweepies/count-patchula
          subject-digest: ${{ steps.push.outputs.arm64 }}
          sbom-path: target/image/sbom/sbom-aarch64.spdx.json
          push-to-registry: true

  release:
    name: Publish
    needs: [smoke, image-publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The archives only: the image artifact is not a release asset.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Count Patchula $GITHUB_REF_NAME" --generate-notes dist/*
      - uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          artifacts: dist/*.tar.gz
          bin: patchula=bin/patchula
          resources: |
            man=archive:share/man/man1/patchula.1
            completion/bash=archive:share/bash-completion/completions/patchula
            completion/zsh=archive:share/zsh/site-functions/_patchula
            completion/fish=archive:share/fish/vendor_completions.d/patchula.fish
            cli-spec/usage=asset:dist/patchula.usage.kdl
            skill/patchula=repo:skills/patchula
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # The Anthropic key lives in Infisical as anthropic-api-key (project
      # INFISICAL_PROJECT_ID, environment prod), read through GitHub OIDC by a machine identity
      # bound to tag refs. Until both repository variables are set, the
      # release keeps GitHub's generated notes.
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: anthropic-api-key
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Write the release notes
        if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        env:
          # Only the release tool, not the workspace toolchains.
          MISE_ENABLE_TOOLS: communique
          GITHUB_TOKEN: ${{ github.token }}
          # The action exports the secret under its Infisical name.
          ANTHROPIC_API_KEY: ${{ env['anthropic-api-key'] }}
        run: mise run release:notes "$GITHUB_REF_NAME"
