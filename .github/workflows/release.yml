name: Release

# Pushing a v* tag builds static archives, checks each one runs on its own
# platform, builds and pushes the server image from the Linux archives,
# publishes the GitHub release with a signed packslip manifest, then lets
# communique rewrite the notes. Pull requests that change the release machinery
# run the build and smoke tests, and build and run the image, without
# publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/config.toml"
      - "Dockerfile"
      - "mise-tasks/**"
      - "mise.toml"
      - "Cargo.lock"

permissions:
  contents: read

# bash, rather than the default "bash -e", also sets pipefail.
defaults:
  run:
    shell: bash

# A tag's release always finishes; a newer push to a pull request supersedes
# its older test runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # The first target of each runs on the runner itself, so it can
          # generate the man page and completions.
          - name: Linux
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - name: macOS
            runner: macos-26
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Check the tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | mise exec jq@1.8.2 -- jq -r '.packages[] | select(.name == "patchula-cli") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match patchula-cli $version" >&2
            exit 1
          fi
      - name: Package
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          mise run release:package $TARGETS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: target/dist/*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux-x64-musl
            runner: ubuntu-latest
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-26
          - platform: darwin-x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Run the binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir smoke
          tar -xzf dist/patchula-v*-"$PLATFORM".tar.gz -C smoke
          smoke/bin/patchula --version | grep -E '^patchula [0-9]+\.[0-9]+\.[0-9]+'
          smoke/bin/patchula config check --help > /dev/null

  image:
    name: Container image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Only a tag logs in to GHCR and pushes.
      packages: write
    env:
      IMAGE: ghcr.io/sweepies/count-patchula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-Linux
          path: dist
      - name: Read the version from the archives
        id: version
        run: |
          archives=(dist/patchula-v*-linux-x64-musl.tar.gz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "Expected one linux-x64-musl archive in dist, found: ${archives[*]}" >&2
            exit 1
          fi
          version=${archives[0]##*/patchula-v}
          version=${version%-linux-x64-musl.tar.gz}
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the archives' version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # A release is X.Y.Z and latest, with no floating minor or major tags,
          # and a prerelease never takes latest. A pull request builds the same
          # labels, which the smoke test checks, and pushes nothing. GHCR reads
          # a multi-platform image's description from its index annotations, so
          # the annotations repeat the labels.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(steps.version.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=Count Patchula
            org.opencontainers.image.description=The Count's GitHub App server: patchula serve, with mise and git for lockfile updates
            org.opencontainers.image.source=https://github.com/sweepies/count-patchula
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Count Patchula
            org.opencontainers.image.description=The Count's GitHub App server: patchula serve, with mise and git for lockfile updates
            org.opencontainers.image.source=https://github.com/sweepies/count-patchula
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      # Each platform is built and run before anything is pushed. The images
      # load into the local Docker, which cannot hold attestations, so they have
      # none; the pushed image has them.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: patchula:smoke
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: patchula:smoke-arm64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      # The server asks GitHub who its App is before it listens, and the API's
      # address is fixed, so a throwaway App needs a stand-in GitHub: openssl
      # serves one answer for api.github.com under a CA that only this container
      # trusts.
      - name: Run the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -u
          image=patchula:smoke
          name=patchula-smoke
          work=$(mktemp -d)
          server=
          finish() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$name" >&2 || true
            fi
            docker rm --force "$name" > /dev/null 2>&1 || true
            if [ -n "$server" ]; then
              sudo kill "$server" || true
            fi
            exit "$status"
          }
          trap finish EXIT

          # The user, the tools and the labels.
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          docker run --rm "$image" --version | grep -Fx "patchula $VERSION"
          docker run --rm --entrypoint mise "$image" --version
          docker run --rm --entrypoint git "$image" --version
          docker run --rm "$image" config check-server /etc/patchula/server.pkl
          for label in "org.opencontainers.image.source=https://github.com/sweepies/count-patchula" \
            "org.opencontainers.image.version=$VERSION" \
            "org.opencontainers.image.revision=$GITHUB_SHA" \
            "org.opencontainers.image.licenses=MIT"; do
            test "$(docker inspect --format "{{index .Config.Labels \"${label%%=*}\"}}" "$image")" = "${label#*=}"
          done

          # Throwaway credentials, and a stand-in for api.github.com.
          openssl genrsa -out "$work/app.pem" 2048
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$work/ca.key" -out "$work/ca.pem" -days 1 \
            -subj "/CN=patchula-smoke-ca" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign"
          openssl req -newkey rsa:2048 -nodes -keyout "$work/github.key" -out "$work/github.csr" -subj "/CN=api.github.com"
          printf 'subjectAltName=DNS:api.github.com\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$work/github.ext"
          openssl x509 -req -in "$work/github.csr" -CA "$work/ca.pem" -CAkey "$work/ca.key" -CAcreateserial -days 1 \
            -extfile "$work/github.ext" -out "$work/github.pem"
          mkdir "$work/www"
          printf '{"slug":"patchula-smoke","client_id":"smoke"}' > "$work/www/app"
          (cd "$work/www" && exec sudo openssl s_server -accept 443 -cert ../github.pem -key ../github.key -WWW -quiet) &
          server=$!
          PATCHULA_APP_PRIVATE_KEY=$(cat "$work/app.pem")
          PATCHULA_WEBHOOK_SECRET=$(openssl rand -hex 32)
          export PATCHULA_APP_PRIVATE_KEY PATCHULA_WEBHOOK_SECRET

          # A fresh named volume takes the image's ownership of /var/lib/patchula.
          docker run --detach --name "$name" \
            --add-host api.github.com:host-gateway \
            --publish 127.0.0.1:8080:8080 \
            --volume patchula-smoke-data:/var/lib/patchula \
            --volume "$work/ca.pem:/etc/smoke-ca.pem:ro" \
            --env SSL_CERT_FILE=/etc/smoke-ca.pem \
            --env PATCHULA_APP_ID=12345 \
            --env PATCHULA_APP_PRIVATE_KEY \
            --env PATCHULA_WEBHOOK_SECRET \
            "$image"
          for _ in $(seq 1 60); do
            if curl --silent --max-time 2 --output /dev/null http://127.0.0.1:8080/healthz; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then
              echo "The server exited before /healthz answered" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/healthz)" = 200
          docker exec "$name" test -f /var/lib/patchula/cache.sqlite
          # The image's own HEALTHCHECK command.
          docker exec "$name" sh -c "$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' "$image")"
      # QEMU runs the arm64 image, so this only checks that it starts.
      - name: Run the arm64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image=patchula:smoke-arm64
          docker run --rm --platform linux/arm64 "$image" --version | grep -Fx "patchula $VERSION"
          docker run --rm --platform linux/arm64 --entrypoint mise "$image" --version
          docker run --rm --platform linux/arm64 --entrypoint git "$image" --version
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # No layer cache is restored, like the archives, but the builder still
      # holds the layers it built above, so the platforms pushed are the ones
      # that ran. The attestations are BuildKit's: an SBOM from its Syft
      # scanner, and the build's provenance at mode=max, which also records the
      # Dockerfile, the base image digests and the archives' hashes.
      - name: Push the image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      - name: Check the pushed image
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          inspection=$(docker buildx imagetools inspect "$IMAGE:$VERSION")
          printf '%s\n' "$inspection"
          grep -q 'Platform: *linux/amd64' <<< "$inspection"
          grep -q 'Platform: *linux/arm64' <<< "$inspection"

  release:
    name: Publish
    needs: [smoke, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Count Patchula $GITHUB_REF_NAME" --generate-notes dist/*
      - uses: jdx/packslip@7d397618045bd98b76cd5cb8177767b2f52789b8 # v1.10.1
        with:
          artifacts: dist/*.tar.gz
          bin: patchula=bin/patchula
          resources: |
            man=archive:share/man/man1/patchula.1
            completion/bash=archive:share/bash-completion/completions/patchula
            completion/zsh=archive:share/zsh/site-functions/_patchula
            completion/fish=archive:share/fish/vendor_completions.d/patchula.fish
            cli-spec/usage=asset:dist/patchula.usage.kdl
            skill/patchula=repo:skills/patchula
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # The Anthropic key lives in Infisical as anthropic-api-key (project
      # INFISICAL_PROJECT_ID, environment prod), read through GitHub OIDC by a machine identity
      # bound to tag refs. Until both repository variables are set, the
      # release keeps GitHub's generated notes.
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: anthropic-api-key
      - if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Write the release notes
        if: vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_ID != ''
        env:
          # Only the release tool, not the workspace toolchains.
          MISE_ENABLE_TOOLS: communique
          GITHUB_TOKEN: ${{ github.token }}
          # The action exports the secret under its Infisical name.
          ANTHROPIC_API_KEY: ${{ env['anthropic-api-key'] }}
        run: mise run release:notes "$GITHUB_REF_NAME"
