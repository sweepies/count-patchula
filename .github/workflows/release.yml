name: Release

# Pushing a v* tag builds static archives, checks each one runs on its own
# platform, publishes the GitHub release with a signed packslip manifest, then
# lets communique rewrite the notes. Pull requests that change the release
# machinery run the build and smoke tests without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/config.toml"
      - "mise-tasks/**"
      - "mise.toml"
      - "Cargo.lock"

permissions:
  contents: read

# bash, rather than the default "bash -e", also sets pipefail.
defaults:
  run:
    shell: bash

# A tag's release always finishes; a newer push to a pull request supersedes
# its older test runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # The first target of each runs on the runner itself, so it can
          # generate the man page and completions.
          - name: Linux
            # Namespace, except for pull requests from forks.
            runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'namespace-profile-ubuntu-amd64-md' }}
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - name: macOS
            runner: macos-26
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      - name: Check the tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | mise exec jq@1.8.2 -- jq -r '.packages[] | select(.name == "patchula-cli") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match patchula-cli $version" >&2
            exit 1
          fi
      - name: Package
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          mise run release:package $TARGETS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: target/dist/*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux-x64-musl
            runner: ubuntu-latest
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-26
          - platform: darwin-x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Run the binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir smoke
          tar -xzf dist/patchula-v*-"$PLATFORM".tar.gz -C smoke
          smoke/bin/patchula --version | grep -E '^patchula [0-9]+\.[0-9]+\.[0-9]+'
          smoke/bin/patchula config check --help > /dev/null

  release:
    name: Publish
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Count Patchula $GITHUB_REF_NAME" --generate-notes dist/*
      - uses: jdx/packslip@7d397618045bd98b76cd5cb8177767b2f52789b8 # v1.10.1
        with:
          artifacts: dist/*.tar.gz
          bin: patchula=bin/patchula
          resources: |
            man=archive:share/man/man1/patchula.1
            completion/bash=archive:share/bash-completion/completions/patchula
            completion/zsh=archive:share/zsh/site-functions/_patchula
            completion/fish=archive:share/fish/vendor_completions.d/patchula.fish
            cli-spec/usage=asset:dist/patchula.usage.kdl
            skill/patchula=repo:skills/patchula
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          # A release never restores a cache, so nothing cached reaches the artifacts.
          cache: false
      # Until ANTHROPIC_API_KEY is in fnox.toml, the release keeps GitHub's
      # generated notes.
      - name: Write the release notes
        continue-on-error: true
        env:
          # Only the release tools, not the workspace toolchains.
          MISE_ENABLE_TOOLS: fnox,communique
          GITHUB_TOKEN: ${{ github.token }}
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          FNOX_IF_MISSING: error
        run: mise run release:notes "$GITHUB_REF_NAME"
