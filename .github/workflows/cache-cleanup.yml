name: Cache cleanup

# A closed pull request's caches can never be restored again, so delete them
# instead of waiting for GitHub to evict them.
on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: "Cache: delete the pull request's caches"
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      # The default branch's script, never the pull request's, gets the write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: mise-tasks/cache
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          # The task is a nu script; nothing else needs installing.
          install_args: nu
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: mise-tasks/cache/prune --all --ref "refs/pull/$PR/merge"
