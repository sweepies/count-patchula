name: Benchmarks

# Report-only measurements, run on demand from the Actions tab. Nothing here
# gates a change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install exactly what mise.lock records, never update it: a build fetches
  # only the tools it uses, so a download host for another tool cannot stall it.
  MISE_LOCKED: "1"

jobs:
  benchmarks:
    name: Benchmarks (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          # Release benchmarks must not publish or restore the CI debug bundle.
          cache-generation: v3-benchmarks-objects
          save-on-pull-request: false
      # No Valgrind entry in mise's registry; host installation is CI-only.
      # If unavailable, tak still reports wall time. Nothing here gates CI.
      - name: Install optional instruction counter
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Measure and record locally (no notes push)
        env:
          GIT_AUTHOR_NAME: patchula benchmarks
          GIT_AUTHOR_EMAIL: noreply@patchula.invalid
          GIT_COMMITTER_NAME: patchula benchmarks
          GIT_COMMITTER_EMAIL: noreply@patchula.invalid
        run: mise run benchmarks:record
      - name: Export portable measurement artifact
        run: mise run benchmarks:export
      - name: Publish timing summary
        if: always()
        run: mise run benchmarks:summary --out "$GITHUB_STEP_SUMMARY"
      - name: Publish report-only results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tak-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14
