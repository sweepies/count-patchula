name: Commits

# GitHub builds a squash merge's message from the pull request's title and adds
# a Co-authored-by line for each commit author, after every local hook has run.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commits:
    name: "Commits: conventional, no AI credit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    foo: bar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mise-tasks/lint
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          # The task is a nu script that calls hk's conventional commit check.
          install_args: nu hk
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: mise-tasks/lint/commits
