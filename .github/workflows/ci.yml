name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs. Runs on main finish,
# since they publish the build cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build jobs run on Namespace. Pull requests from forks use GitHub's runners
# instead, so untrusted code never reaches the Namespace machines.
jobs:
  # The workflow always runs, so "CI result" can be a required check. Changes
  # that only touch the docs site (built by docs.yml) skip the Rust jobs.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            files=unknown
          else
            # The compare API lists at most 300 files; assume more means Rust.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq 'if (.files | length) >= 300 then "unknown" else .files[].filename end')
          fi
          if printf '%s\n' "$files" | grep -Eqv '^(docs/|README\.md$|\.github/workflows/docs\.yml$)'; then
            rust=true
          else
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Rust jobs: $rust" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'namespace-profile-ubuntu-amd64-md' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cache mise installs, including the task-scoped lockfile toolchains the
      # real-tool tests install (Python, Ruby, .NET, PHP), keyed on mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
      # Transport mbx objects, predictions and build-script state between runners.
      # Default-branch pushes publish in the post step; PRs only restore.
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        id: mbx
        # The pinned action has no nonfatal-cache input. This also covers its post step.
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          # All target consumers finish before the post step; keep only portable objects.
          clean-target-before-export: true
          cache-generation: v3-ci-objects
          save-on-pull-request: false
      - name: Inspect cache configuration
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.mbx.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.mbx.outputs.cache-hit }}
          CACHE_SAVE_ELIGIBLE: ${{ steps.mbx.outputs.cache-save-eligible }}
          CACHE_SAVE_REASON: ${{ steps.mbx.outputs.cache-save-reason }}
        run: |
          printf 'mbx key=%s exact-hit=%s save=%s (%s)\n' "$CACHE_KEY" "$CACHE_HIT" "$CACHE_SAVE_ELIGIBLE" "$CACHE_SAVE_REASON"
          mise run cache:doctor
      - run: mise run ci
      - name: Measure build storage before cache export
        run: |
          du -sh target/.
          df -h . "${RUNNER_TEMP}"

  corpus:
    name: Corpus lookup
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'namespace-profile-ubuntu-amd64-md' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v3-corpus-objects
          save-on-pull-request: false
      # Registry validators and catalogs carry over between runs, like a real
      # deployment's cache; a cold run still works, just slower.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-${{ github.run_id }}
          restore-keys: corpus-
      # A dry run looks every dependency up and plans every branch, editing
      # each manifest in memory, without writing anything.
      - name: Look up and plan every corpus dependency
        env:
          PATCHULA_TOKEN: ${{ github.token }}
          CACHE_DIR: ${{ runner.temp }}/corpus-cache
        run: |
          mkdir -p "$CACHE_DIR"
          mise run corpus:check --cache "$CACHE_DIR/cache.sqlite" > corpus-report.json 2> corpus.log || { grep -v '^[-+@ ]' corpus.log | tail -40; exit 1; }
          jq='mise exec jq@1.8.2 -- jq'
          {
            echo '### Corpus'
            echo '```'
            grep -E 'dependencies,|visited|timings|^  warning' corpus.log
            $jq -r '.actions.branches | group_by(.status) | map("\(.[0].status): \(length) branches") | .[]' corpus-report.json
            $jq -r '.actions.branches[] | select(.status == "skipped" or .status == "error") | "\(.status) \(.branch): \(.reason)"' corpus-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          errors=$($jq '[.actions.branches[] | select(.status == "error")] | length' corpus-report.json)
          if [ "$errors" != 0 ]; then
            echo "::error::$errors corpus branches failed to plan"
            exit 1
          fi
      - name: Publish the corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-report.json
          if-no-files-found: warn
          retention-days: 14

  benchmarks:
    name: Benchmarks (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'namespace-profile-ubuntu-amd64-md' }}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          # Release benchmarks must not publish or restore the CI debug bundle.
          cache-generation: v3-benchmarks-objects
          save-on-pull-request: false
      # No Valgrind entry in mise's registry; host installation is CI-only.
      # If unavailable, tak still reports wall time. Nothing here gates CI.
      - name: Install optional instruction counter
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Measure and record locally (no notes push)
        env:
          GIT_AUTHOR_NAME: patchula benchmarks
          GIT_AUTHOR_EMAIL: noreply@patchula.invalid
          GIT_COMMITTER_NAME: patchula benchmarks
          GIT_COMMITTER_EMAIL: noreply@patchula.invalid
        run: mise run benchmarks:record
      - name: Export portable measurement artifact
        run: mise run benchmarks:export
      - name: Measure build storage before cache export
        run: |
          du -sh target/.
          df -h . "${RUNNER_TEMP}"
      - name: Publish timing summary
        if: always()
        run: |
          if [ -f benchmark-results/summary.txt ]; then
            {
              printf '<pre>\n'
              mise exec -- cat benchmark-results/summary.txt
              printf '</pre>\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish report-only results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tak-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14

  # The one check to require. Skipped Rust jobs count as passing; failed or
  # cancelled ones, or a failed path check, do not. Benchmarks never gate.
  result:
    name: CI result
    needs: [changes, ci, corpus]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "A required job did not pass: $RESULTS"
          exit 1
      - run: echo "Required jobs passed or were skipped."
