name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes and pull requests test only what their changes can affect; this run
  # tests everything, so whatever a selective run missed turns up within hours.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs, and a newer
# scheduled run supersedes an older one. Runs on main finish, since they
# publish the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'dispatch' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

# Every job runs one or two mise tasks, so `mise run ci` runs the same checks
# locally.
env:
  # Install exactly what mise.lock records, never update it: a build fetches
  # only the tools it uses, so a download host for another tool cannot stall it.
  MISE_LOCKED: "1"

jobs:
  # ci:plan maps the changed paths to the jobs and crates they can affect,
  # through the workspace's dependency graph, and packs the affected crates'
  # tests into shards by measured weight. A path it does not know runs
  # everything. A skipped job still reports its check.
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # release:bump --check reads the CI result of the release commit's parent.
      actions: read
    outputs:
      lint_all: ${{ steps.plan.outputs.lint_all }}
      rust_lint: ${{ steps.plan.outputs.rust_lint }}
      build: ${{ steps.plan.outputs.build }}
      build_cli: ${{ steps.plan.outputs.build_cli }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
      tools: ${{ steps.plan.outputs.tools }}
      corpus: ${{ steps.plan.outputs.corpus }}
      docs: ${{ steps.plan.outputs.docs }}
      test_shards: ${{ steps.plan.outputs.test_shards }}
      from_ref: ${{ steps.plan.outputs.from_ref }}
    env:
      # The release bot's own PR from this repository, the only one whose
      # version bump may skip the Rust jobs: the check runs the PR's own copy
      # of release:bump, so a fork could name its branch release-next and make
      # it skip its tests. One predicate, so the steps cannot drift apart.
      RELEASE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-next' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'sweepies-ops[bot]' }}
      # The Count's own batch PR from this repository, the only one the
      # batch-green trailer check may skip the heavy jobs for.
      BATCH_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'patchula/batch' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'sweepies-ops[bot]' }}
    steps:
      # A pull request's merge commit and its parents, or a push and the commit
      # before it; ci:plan fetches more when it needs it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
        env:
          MISE_ENABLE_TOOLS: ${{ (env.RELEASE_PR == 'true' || github.event_name == 'push') && 'nu,gh' || 'nu' }}
      # A pull request's changes are its merge commit against the base branch
      # (HEAD^1); the release and batch checks inspect the pull request's own
      # head commit and base instead.
      - id: plan
        env:
          MISE_ENABLE_TOOLS: ${{ (env.RELEASE_PR == 'true' || github.event_name == 'push') && 'nu,gh' || 'nu' }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          mise run ci:plan --event "$EVENT" --base "$BASE" --head HEAD
          --pr-head "$PR_HEAD" --pr-base "$PR_BASE"
          --release-pr="$RELEASE_PR" --batch-pr="$BATCH_PR"
          --summary "$GITHUB_STEP_SUMMARY"

  # hk.pkl's check hook, the same steps the git hooks run, plus Clippy. It runs
  # on every change, since it is the only secret scan in CI, but each step
  # checks only the files the push or pull request changed, and a step whose
  # files are untouched does not run.
  lint:
    name: "Lint: hk"
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Code scanning shows hk's findings on the diff.
      security-events: write
    env:
      # Clippy and rustfmt need the Rust toolchain only when Rust may have
      # changed; otherwise they skip and the toolchain is left out. That
      # includes the release bot's version bump, whose Cargo.toml and
      # Cargo.lock changes would otherwise start Clippy.
      MISE_ENABLE_TOOLS: ${{ needs.changes.outputs.rust_lint == 'true' && 'rust,mr-boxington,zig,hk,pkl,jactionlint,betterleaks,zizmor,forgejo:wvhulle/nu-lint' || 'hk,pkl,jactionlint,betterleaks,zizmor,forgejo:wvhulle/nu-lint' }}
      HK_SKIP_STEPS: ${{ needs.changes.outputs.rust_lint != 'true' && 'clippy,cargo-fmt' || '' }}
      FROM_REF: ${{ needs.changes.outputs.from_ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit has the base branch as its first
          # parent; a push of one commit has the commit before it.
          fetch-depth: 2
      # A push of several commits compares with a commit the shallow checkout
      # lacks. hk diffs the two trees when their merge base is missing.
      - if: needs.changes.outputs.lint_all != 'true' && github.event_name == 'push'
        run: git cat-file -e "$FROM_REF^{commit}" 2>/dev/null || git fetch --no-tags --depth=50 origin "$FROM_REF" || git fetch --no-tags --unshallow origin
      # mise checks every stored download against mise.lock before it uses
      # it, so the store is cached instead of the installs.
      - id: mise-downloads
        if: needs.changes.outputs.rust_lint == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: &mise-downloads ~/.cache/mise/downloads-cas
          key: &mise-downloads-rust-key mise-downloads-rust-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: &mise-downloads-rust-restore mise-downloads-rust-${{ runner.os }}-
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - id: cargo-downloads
        if: needs.changes.outputs.rust_lint == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: &cargo-downloads |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: &cargo-downloads-key cargo-downloads-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: &cargo-downloads-restore cargo-downloads-v1-
      - if: needs.changes.outputs.rust_lint == 'true'
        uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
        # The pinned action has no nonfatal-cache input. This also covers its post step.
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          # All target consumers finish before the post step; keep only portable objects.
          clean-target-before-export: true
          cache-generation: v5-lint-objects
          save-on-pull-request: false
          save-on-workflow-dispatch: true
      - if: needs.changes.outputs.lint_all == 'true'
        env:
          # zizmor's online audits, such as impostor commits.
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:ci --all
      - if: needs.changes.outputs.lint_all != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:ci "$FROM_REF"
      - if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        # A fork's pull request gets a read-only token and cannot upload; its
        # findings are still in the log above.
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/hk.sarif
          category: hk
      # With Clippy, this job installs exactly the Rust tools the build and
      # test jobs use, plus the small lint tools, so it publishes their store.
      - if: github.ref == 'refs/heads/main' && needs.changes.outputs.rust_lint == 'true' && steps.mise-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: *mise-downloads
          key: *mise-downloads-rust-key
      # Clippy checks every target, so it fetches every crate the other jobs
      # build; this job alone publishes the downloads, from main.
      - if: github.ref == 'refs/heads/main' && needs.changes.outputs.rust_lint == 'true' && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key

  build:
    name: "Build: debug binary, fixture secret scan"
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: rust,mr-boxington,zig
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-rust-key
          restore-keys: *mise-downloads-rust-restore
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: *cargo-downloads-restore
      - uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
        continue-on-error: true
        env:
          # A fixture-scan-only push restores the CLI build's bundle read-only
          # so it does not overwrite the full build cache with a partial one.
          ACTIONS_CACHE_MODE: ${{ needs.changes.outputs.build_cli != 'true' && 'read' || '' }}
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v5-build-objects
          save-on-pull-request: false
          save-on-workflow-dispatch: true
      # The corpus lookup runs this binary instead of building its own. Artifacts
      # belong to the run, not the attempt, so a rerun of only the corpus job
      # still finds it, and a rerun of this job replaces it.
      - if: needs.changes.outputs.build_cli == 'true'
        run: mise run build:cli-debug
      - if: needs.changes.outputs.build_cli == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: patchula-debug
          overwrite: true
          path: target/debug/patchula
          if-no-files-found: error
          retention-days: 1
      - if: needs.changes.outputs.fixtures == 'true'
        run: mise run fixtures:check

  # Each shard tests the crates ci:plan packed into it. A full run's shards
  # keep the same crates, so each publishes its own objects cache; a selective
  # run restores that shard's bundle read-only instead of overwriting it.
  test:
    name: "Tests: unit (${{ matrix.shard.shard }})"
    needs: changes
    if: needs.changes.outputs.test_shards != '[]' && needs.changes.outputs.test_shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.test_shards) }}
    env:
      PATCHULA_RECORD: "0"
      MISE_ENABLE_TOOLS: rust,mr-boxington,zig
      PACKAGES: ${{ matrix.shard.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-rust-key
          restore-keys: *mise-downloads-rust-restore
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: *cargo-downloads-restore
      - uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
        continue-on-error: true
        env:
          # Selective runs restore the shard's full bundle read-only so a
          # partial push to main neither overwrites it nor saves an unused
          # partial bundle.
          ACTIONS_CACHE_MODE: ${{ !matrix.shard.full && 'read' || '' }}
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v5-test-${{ matrix.shard.shard }}-objects
          save-on-pull-request: false
          save-on-workflow-dispatch: true
      - run: mise run test:unit --packages "$PACKAGES"

  tools:
    name: "Tests: real lockfile tools"
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATCHULA_RECORD: "0"
      # yarn and poetry install through vfox plugins, whose downloads mise
      # cannot lock, so locked mode would refuse them.
      MISE_LOCKED: "0"
      # The Rust tools and the lockfile engines; none of the lint tools.
      MISE_DISABLE_TOOLS: tak,usage,nu,hk,pkl,jactionlint,betterleaks,zizmor,forgejo:wvhulle/nu-lint,cargo:nu-lint,http:deepsource
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only this job installs the lockfile engines, so their store is its own.
      - id: mise-downloads
        uses: actions/cache/restore@v6.1.0
        with:
          path: *mise-downloads
          key: &mise-downloads-tools-key mise-downloads-tools-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-downloads-tools-${{ runner.os }}-
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: *cargo-downloads-restore
      - uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v5-tools-objects
          save-on-pull-request: false
          save-on-workflow-dispatch: true
      - run: mise run test:tools
      - if: github.ref == 'refs/heads/main' && steps.mise-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: *mise-downloads
          key: *mise-downloads-tools-key

  # The lookup is mostly network time, so the build job's dev binary does it
  # instead of a release build of its own.
  corpus:
    name: "Corpus: lookup"
    needs: [changes, build]
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # corpus:report is the only tool this job installs; the binary is the
      # build job's.
      MISE_ENABLE_TOOLS: nu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: patchula-debug
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/patchula"
      # Registry validators and catalogs carry over between runs, like a real
      # deployment's cache; a cold run still works, just slower. Only the
      # database carries over, not the repository worktrees beside it. Main
      # publishes.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache/cache.sqlite
          key: corpus-v3-${{ github.run_id }}
          restore-keys: corpus-v3-
      # A dry run looks every dependency up and plans every branch, editing
      # each manifest in memory, without writing anything.
      - name: Look up and plan every corpus dependency
        env:
          PATCHULA_TOKEN: ${{ github.token }}
          PATCHULA_BIN: ${{ runner.temp }}/bin/patchula
        run: mise run corpus:report --cache "$RUNNER_TEMP/corpus-cache" --summary "$GITHUB_STEP_SUMMARY"
      # Fold the write-ahead log in and drop free pages, so the saved database
      # stays small.
      - if: github.ref == 'refs/heads/main'
        run: if [ -f "$RUNNER_TEMP/corpus-cache/cache.sqlite" ]; then sqlite3 "$RUNNER_TEMP/corpus-cache/cache.sqlite" "PRAGMA wal_checkpoint(TRUNCATE); VACUUM;"; fi
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/corpus-cache/cache.sqlite
          key: corpus-v3-${{ github.run_id }}
      - name: Publish the corpus report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: corpus-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-report.json
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: "Docs: build"
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The docs tasks' own tools.
      MISE_ENABLE_TOOLS: node,aube
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@v6.1.0
        with:
          path: *mise-downloads
          key: &mise-downloads-docs-key mise-downloads-docs-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-downloads-docs-${{ runner.os }}-
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: mise run docs:build
      - if: github.ref == 'refs/heads/main' && steps.mise-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: *mise-downloads
          key: *mise-downloads-docs-key
