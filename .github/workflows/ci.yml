name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs. Runs on main finish,
# since they publish the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs one or two mise tasks, so `mise run ci` runs the same checks
# locally.
jobs:
  # Each job below runs only when a changed path can affect it; a docs-only
  # change skips the Rust jobs. A skipped job still reports its check.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.some.outputs.rust == 'true' || steps.every.outputs.rust == 'true' }}
      docs: ${{ steps.some.outputs.docs }}
    steps:
      # A push is compared with the commit before it, which needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A file counts when it matches any pattern of a filter.
      - id: some
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - .github/workflows/ci.yml
            docs:
              - docs/**
              - mise.toml
              - tasks.toml
              - mise.lock
              - .github/workflows/ci.yml
      # A file counts when it matches every pattern: anything outside these
      # may change what the Rust jobs check.
      - id: every
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - "**"
              - "!docs/**"
              - "!assets/**"
              - "!skills/**"
              - "!.claude/**"
              - "!README.md"
              - "!AGENTS.md"
              - "!CLAUDE.md"
              - "!LICENSE"
              - "!.gitignore"
              - "!socket.yml"
              - "!communique.toml"
              - "!tak.toml"
              # hk lints the workflows on every change.
              - "!action.yml"
              - "!.github/**"

  # hk.pkl's check hook, the same steps the git hooks run, plus Clippy. It runs
  # on every change, since it is the only secret scan in CI, but each step
  # checks only the files the push or pull request changed, and a step whose
  # files are untouched does not run.
  lint:
    name: "Lint: hk"
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Code scanning shows hk's findings on the diff.
      security-events: write
    env:
      # Lint never needs these. Without Rust changes, Clippy and rustfmt do
      # not run either, so their toolchain is left out too.
      MISE_DISABLE_TOOLS: go,node,tak,usage,nu,http:deepsource${{ needs.changes.outputs.rust != 'true' && ',rust,mr-boxington,zig' || '' }}
      # A pull request's merge commit has the base branch as its first parent.
      FROM_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hk compares against the base branch, or the commit before a push.
          fetch-depth: 0
      # mise checks every stored download against mise.lock before it uses
      # it, so the store is cached instead of the installs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &mise-downloads ~/.cache/mise/downloads-cas
          key: &mise-downloads-key mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: &mise-downloads-restore mise-downloads-${{ runner.os }}-
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - id: cargo-downloads
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cargo-downloads |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: &cargo-downloads-key cargo-downloads-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: &cargo-downloads-restore cargo-downloads-v1-
      - if: needs.changes.outputs.rust == 'true'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        # The pinned action has no nonfatal-cache input. This also covers its post step.
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          # All target consumers finish before the post step; keep only portable objects.
          clean-target-before-export: true
          cache-generation: v4-lint-objects
          save-on-pull-request: false
      - env:
          # zizmor's online audits, such as impostor commits.
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:ci "$FROM_REF"
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # A fork's pull request gets a read-only token and cannot upload; its
        # findings are still in the log above.
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/hk.sarif
          category: hk
      # Clippy checks every target, so it fetches every crate the other jobs
      # build; this job alone publishes the downloads, from main.
      - if: github.ref == 'refs/heads/main' && needs.changes.outputs.rust == 'true' && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key

  build:
    name: "Build: workspace, fixture secret scan"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: *cargo-downloads-restore
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v4-build-objects
          save-on-pull-request: false
      - run: mise run build
      # The corpus lookup runs this binary instead of building its own. Artifacts
      # belong to the run, not the attempt, so a rerun of only the corpus job
      # still finds it, and a rerun of this job replaces it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchula-debug
          overwrite: true
          path: target/debug/patchula
          if-no-files-found: error
          retention-days: 1
      # The scanner is a dev binary, so it reuses the build above.
      - run: mise run fixtures:check

  # patchula-update's suite takes about a minute on its own, so it runs beside
  # the other crates instead of after them.
  test:
    name: "Tests: unit (${{ matrix.part }})"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [update, others]
    env:
      PATCHULA_RECORD: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: *cargo-downloads-restore
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v4-test-${{ matrix.part }}-objects
          save-on-pull-request: false
      - run: mise run test:unit --part "${{ matrix.part }}"

  tools:
    name: "Tests: real lockfile tools"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATCHULA_RECORD: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: *cargo-downloads-restore
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v4-tools-objects
          save-on-pull-request: false
      - run: mise run test:tools
      # This job installs the base tools and every lockfile engine, so its
      # store holds nearly every download the other jobs need.
      - if: github.ref == 'refs/heads/main' && steps.mise-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: *mise-downloads
          key: *mise-downloads-key

  # The lookup is mostly network time, so the build job's dev binary does it
  # instead of a release build of its own, which took about two minutes and a
  # separate 250 MB objects cache.
  corpus:
    name: "Corpus: lookup"
    needs: [changes, build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patchula-debug
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/patchula"
      # Registry validators and catalogs carry over between runs, like a real
      # deployment's cache; a cold run still works, just slower. Main publishes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-v2-${{ github.run_id }}
          restore-keys: corpus-v2-
      # A dry run looks every dependency up and plans every branch, editing
      # each manifest in memory, without writing anything.
      - name: Look up and plan every corpus dependency
        env:
          PATCHULA_TOKEN: ${{ github.token }}
          PATCHULA_BIN: ${{ runner.temp }}/bin/patchula
        run: mise run corpus:report --cache "$RUNNER_TEMP/corpus-cache" --summary "$GITHUB_STEP_SUMMARY"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-v2-${{ github.run_id }}
      - name: Publish the corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-report.json
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: "Docs: build"
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: mise run docs:build
