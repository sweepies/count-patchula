name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs. Runs on main finish,
# since they publish the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs one or two mise tasks, so `mise run ci` runs the same checks
# locally.
jobs:
  # Each job below runs only when a changed path can affect it; a docs-only
  # change runs just the docs build.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      actions: ${{ steps.filter.outputs.actions }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mise-tasks/ci
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          # The task is a nu script; nothing else needs installing.
          install_args: nu
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: mise-tasks/ci/changes

  lint:
    name: "Lint: rustfmt, clippy"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise checks every stored download against mise.lock before it uses
      # it, so the store is cached instead of the installs.
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &mise-downloads ~/.cache/mise/downloads-cas
          key: &mise-downloads-key mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: &mise-downloads-restore mise-downloads-${{ runner.os }}-
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - id: cargo-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cargo-downloads |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: &cargo-downloads-key cargo-downloads-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-v1-
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        # The pinned action has no nonfatal-cache input. This also covers its post step.
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          # All target consumers finish before the post step; keep only portable objects.
          clean-target-before-export: true
          cache-generation: v4-lint-objects
          save-on-pull-request: false
      - run: mise run lint:rust
      # Clippy checks every target, so it fetches every crate the other jobs
      # build; this job alone publishes the downloads, from main.
      - if: github.ref == 'refs/heads/main' && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
      - run: mise run cache:usage

  workflows:
    name: "Lint: workflows"
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - run: mise run lint:actions

  build:
    name: "Build: workspace, fixture secret scan"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: cargo-downloads-v1-
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v4-build-objects
          save-on-pull-request: false
      - run: mise run build
      # The corpus lookup runs this binary instead of building its own. Artifacts
      # belong to the run, not the attempt, so a rerun of only the corpus job
      # still finds it, and a rerun of this job replaces it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchula-debug
          overwrite: true
          path: target/debug/patchula
          if-no-files-found: error
          retention-days: 1
      # The scanner is a dev binary, so it reuses the build above.
      - run: mise run fixtures:check
      - run: mise run cache:usage

  # patchula-update's suite takes about a minute on its own, so it runs beside
  # the other crates instead of after them.
  test:
    name: "Tests: unit (${{ matrix.part }})"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [update, others]
    env:
      PATCHULA_RECORD: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: cargo-downloads-v1-
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v4-test-${{ matrix.part }}-objects
          save-on-pull-request: false
      - run: mise run test:unit --part "${{ matrix.part }}"
      - run: mise run cache:usage

  tools:
    name: "Tests: real lockfile tools"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATCHULA_RECORD: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-downloads
          key: *cargo-downloads-key
          restore-keys: cargo-downloads-v1-
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v4-tools-objects
          save-on-pull-request: false
      - run: mise run test:tools
      # This job installs the base tools and every lockfile engine, so its
      # store holds nearly every download the other jobs need.
      - if: github.ref == 'refs/heads/main' && steps.mise-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: *mise-downloads
          key: *mise-downloads-key
      - run: mise run cache:usage

  docs:
    name: "Docs: build"
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - run: mise run docs:build

  # The lookup is mostly network time, so the build job's dev binary does it
  # instead of a release build of its own, which took about two minutes and a
  # separate 250 MB objects cache.
  corpus:
    name: "Corpus: lookup"
    needs: [changes, build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mise-downloads
          key: *mise-downloads-key
          restore-keys: *mise-downloads-restore
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patchula-debug
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/patchula"
      # Registry validators and catalogs carry over between runs, like a real
      # deployment's cache; a cold run still works, just slower. Main publishes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-v2-${{ github.run_id }}
          restore-keys: corpus-v2-
      # A dry run looks every dependency up and plans every branch, editing
      # each manifest in memory, without writing anything.
      - name: Look up and plan every corpus dependency
        env:
          PATCHULA_TOKEN: ${{ github.token }}
          PATCHULA_BIN: ${{ runner.temp }}/bin/patchula
        run: mise run corpus:report --cache "$RUNNER_TEMP/corpus-cache" --summary "$GITHUB_STEP_SUMMARY"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-v2-${{ github.run_id }}
      - name: Publish the corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-report.json
          if-no-files-found: warn
          retention-days: 14

  # Every save above makes a new immutable entry, and GitHub only evicts past
  # the repository limit, so main keeps only the newest entry of each family
  # below and deletes the rest, including families no job saves any more. A
  # cache main should keep must be listed here. A failed job saves nothing,
  # and its family keeps its last entry.
  prune:
    name: "Cache: prune superseded entries"
    needs: [lint, workflows, build, test, tools, docs, corpus]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mise-tasks/cache
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          # The task is a nu script; nothing else needs installing.
          install_args: nu
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          mise-tasks/cache/prune --drop-others
          mise-downloads- cargo-downloads-v1- corpus-v2- patchula-v2-
          linux-x64-mbx-v4-lint-objects- linux-x64-mbx-v4-build-objects-
          linux-x64-mbx-v4-test-update-objects- linux-x64-mbx-v4-test-others-objects-
          linux-x64-mbx-v4-tools-objects- docker.io--tonistiigi--binfmt-
