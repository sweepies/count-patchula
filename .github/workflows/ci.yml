name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs. Runs on main finish,
# since they publish the build cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The workflow always runs, so "CI result" can be a required check. Changes
  # that no Rust job reads, such as the docs site (which Cloudflare builds),
  # skip the Rust jobs. Changes to workflows other than this one only lint
  # the workflows.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            files=unknown
          else
            # The compare API lists at most 300 files; assume more means Rust.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq 'if (.files | length) >= 300 then "unknown" else .files[].filename end')
          fi
          rust=false
          actions=false
          while IFS= read -r file; do
            case "$file" in
              # The conformance tests read the departures page.
              docs/src/content/docs/renovate/departures.md) rust=true ;;
              docs/* | assets/* | skills/* | .claude/* | conformance/README.md | README.md | AGENTS.md | CLAUDE.md | LICENSE | .gitignore | .deepsource.toml | socket.yml | communique.toml | tak.toml) ;;
              action.yml | .github/workflows/action.yml | .github/workflows/release.yml | .github/workflows/benchmarks.yml | .github/workflows/boat-snapshot.yml) actions=true ;;
              # Anything else, including "unknown", may change what the Rust jobs check.
              *) rust=true ;;
            esac
          done <<< "$files"
          {
            echo "rust=$rust"
            echo "actions=$actions"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Rust jobs: $rust"
            echo "Workflow lint only: $([ "$rust" = false ] && echo "$actions" || echo false)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Rust jobs run in boat sandboxes started from the CI snapshot when this
  # job finds the boat key and a ready snapshot. Otherwise (a fork pull
  # request, which gets no OIDC token, no Infisical binding, or no snapshot
  # yet) they run on GitHub runners with the mbx cache. The key lives in
  # Infisical as boat-api-key and is read through GitHub OIDC. See
  # docs/src/content/docs/internals/boat.md.
  boat:
    name: Boat snapshot
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      snapshot: ${{ steps.current.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: vars.INFISICAL_PROJECT_ID != '' && (vars.INFISICAL_BOAT_IDENTITY_ID || vars.INFISICAL_IDENTITY_ID) != ''
        # A refused token means the runners; it never fails CI.
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_BOAT_IDENTITY_ID || vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: boat-api-key
      - if: env['boat-api-key'] != ''
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: false
      - id: current
        env:
          BOAT_API_KEY: ${{ env['boat-api-key'] }}
          MISE_ENABLE_TOOLS: jq
        run: |
          snapshot=""
          if [ -z "$BOAT_API_KEY" ]; then
            reason="no boat key from Infisical"
          elif ! snapshot=$(mise run boat:current); then
            reason="the boat API did not list the snapshots"
            snapshot=""
          elif [ -z "$snapshot" ]; then
            reason="no ready snapshot; run the Boat snapshot workflow"
          fi
          if [ -n "$snapshot" ]; then
            echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
            echo "Rust jobs: boat, from $snapshot" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Rust jobs run on GitHub runners: $reason"
            echo "Rust jobs: GitHub runners ($reason)" >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: [changes, boat]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.boat.outputs.snapshot != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_BOAT_IDENTITY_ID || vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: boat-api-key
      # On a runner, cache mise installs, including the task-scoped lockfile
      # toolchains the real-tool tests install (Python, Ruby, .NET, PHP), keyed
      # on mise.toml. On boat the snapshot holds them, so mise only runs tasks.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: ${{ needs.boat.outputs.snapshot == '' }}
          cache: ${{ needs.boat.outputs.snapshot == '' }}
      - name: Run the checks on boat
        if: needs.boat.outputs.snapshot != ''
        env:
          BOAT_API_KEY: ${{ env['boat-api-key'] }}
          SNAPSHOT: ${{ needs.boat.outputs.snapshot }}
          # Only the boat tasks' tools on the runner, not the workspace toolchains.
          MISE_ENABLE_TOOLS: jq,http:boat
        run: mise run boat:run --from "$SNAPSHOT" -- mise run ci
      # Transport mbx objects, predictions and build-script state between runners.
      # Default-branch pushes publish in the post step; PRs only restore.
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        if: needs.boat.outputs.snapshot == ''
        id: mbx
        # The pinned action has no nonfatal-cache input. This also covers its post step.
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          # All target consumers finish before the post step; keep only portable objects.
          clean-target-before-export: true
          cache-generation: v3-ci-objects
          save-on-pull-request: false
      - name: Inspect cache configuration
        if: needs.boat.outputs.snapshot == ''
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.mbx.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.mbx.outputs.cache-hit }}
          CACHE_SAVE_ELIGIBLE: ${{ steps.mbx.outputs.cache-save-eligible }}
          CACHE_SAVE_REASON: ${{ steps.mbx.outputs.cache-save-reason }}
        run: |
          printf 'mbx key=%s exact-hit=%s save=%s (%s)\n' "$CACHE_KEY" "$CACHE_HIT" "$CACHE_SAVE_ELIGIBLE" "$CACHE_SAVE_REASON"
          mise run cache:doctor
      - if: needs.boat.outputs.snapshot == ''
        run: mise run ci
      - name: Measure build storage before cache export
        if: needs.boat.outputs.snapshot == ''
        run: |
          du -sh target/.
          df -h . "${RUNNER_TEMP}"

  # The ci job lints the workflows too; this runs when only workflows changed.
  actions:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.rust != 'true' && needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
      - run: mise run lint:actions

  corpus:
    name: Corpus lookup
    needs: [changes, boat]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.boat.outputs.snapshot != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_BOAT_IDENTITY_ID || vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-name: boat-api-key
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: ${{ needs.boat.outputs.snapshot == '' }}
          cache: ${{ needs.boat.outputs.snapshot == '' }}
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        if: needs.boat.outputs.snapshot == ''
        continue-on-error: true
        with:
          backend: github
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          cache-generation: v3-corpus-objects
          save-on-pull-request: false
      # Registry validators and catalogs carry over between runs, like a real
      # deployment's cache; a cold run still works, just slower. The cache sits
      # in the checkout so that boat:run copies it into the sandbox and back.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus-cache
          key: corpus-v2-${{ github.run_id }}
          restore-keys: corpus-v2-
      # A dry run looks every dependency up and plans every branch, editing
      # each manifest in memory, without writing anything.
      - name: Look up and plan every corpus dependency on boat
        if: needs.boat.outputs.snapshot != ''
        env:
          # The read-only job token is the one secret the sandbox receives.
          PATCHULA_TOKEN: ${{ github.token }}
          BOAT_API_KEY: ${{ env['boat-api-key'] }}
          SNAPSHOT: ${{ needs.boat.outputs.snapshot }}
          # Only the boat tasks' tools on the runner, not the workspace toolchains.
          MISE_ENABLE_TOOLS: jq,http:boat
        run: |
          mkdir -p .corpus-cache
          mise run boat:run --from "$SNAPSHOT" --pass PATCHULA_TOKEN --fetch .corpus-cache --fetch corpus-report.json --fetch corpus.log -- \
            bash -c "mise run corpus:check --cache /home/user/count-patchula/.corpus-cache > corpus-report.json 2> corpus.log" ||
            { grep -v '^[-+@ ]' corpus.log | tail -40; exit 1; }
      - name: Look up and plan every corpus dependency on this runner
        if: needs.boat.outputs.snapshot == ''
        env:
          PATCHULA_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .corpus-cache
          mise run corpus:check --cache "$PWD/.corpus-cache" > corpus-report.json 2> corpus.log || { grep -v '^[-+@ ]' corpus.log | tail -40; exit 1; }
      - name: Summarize the corpus
        env:
          MISE_ENABLE_TOOLS: jq
        run: |
          jq='mise exec jq@1.8.2 -- jq'
          {
            echo '### Corpus'
            echo '```'
            grep -E '^patchula' corpus.log
            $jq -r '.repositories[] | "\(.repository): \([.packageFiles[].dependencies[]] | length) dependencies, \([.packageFiles[].dependencies[].updates[]] | length) updates", ((.warnings // [])[] | "  warning: \(.)")' corpus-report.json
            $jq -r '.actions.branches | group_by(.status) | map("\(.[0].status): \(length) branches") | .[]' corpus-report.json
            $jq -r '.actions.branches[] | select(.status == "skipped" or .status == "error") | "\(.status) \(.branch): \(.reason)"' corpus-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          errors=$($jq '[.actions.branches[] | select(.status == "error")] | length' corpus-report.json)
          if [ "$errors" != 0 ]; then
            echo "::error::$errors corpus branches failed to plan"
            exit 1
          fi
      - name: Publish the corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-report.json
          if-no-files-found: warn
          retention-days: 14

  # The one check to require. Skipped jobs count as passing; failed or
  # cancelled ones, or a failed path check, do not.
  result:
    name: CI result
    needs: [changes, boat, ci, actions, corpus]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "A required job did not pass: $RESULTS"
          exit 1
      - run: echo "Required jobs passed or were skipped."
