name: Action

# Runs the repository's own action as a read-only dry run whenever it changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "action.yml"
      - ".github/workflows/action.yml"
      - "tests/action/**"
  pull_request:
    paths: *paths

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This repository has no config of its own, so a GitHub Actions-only one
      # stands in: the dry run plans real updates without lockfile tools.
      - uses: ./
        with:
          token: ${{ github.token }}
          dry-run: "true"
          args: |
            --config tests/action/patchula.pkl
