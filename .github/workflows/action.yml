name: Action

# Runs the repository's own action as a read-only dry run whenever it changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "action.yml"
      - ".github/workflows/action.yml"
      - "mise-tasks/action/**"
      - "tests/action/**"
  pull_request:
    paths: *paths

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only the task's tools, enabled per step: the action's own mise exec
      # must not inherit the list.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
        env:
          MISE_ENABLE_TOOLS: nu,gh
      # The action runs the latest release, which can predate this checkout's
      # schema. Pin that release here and write its own schema beside the
      # stand-in config, so the two always match.
      - id: release
        env:
          MISE_ENABLE_TOOLS: nu,gh
          GH_TOKEN: ${{ github.token }}
        run: mise run action:pin-release
      # A GitHub Actions-only config stands in for this repository's own, so
      # the dry run plans real updates without lockfile tools.
      - uses: $/
        with:
          token: ${{ github.token }}
          dry-run: "true"
          version: ${{ steps.release.outputs.version }}
          args: |
            --config tests/action/patchula.pkl
