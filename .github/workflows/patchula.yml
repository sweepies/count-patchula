name: Count Patchula

# The Count updates his own repository, set up the way the GitHub Actions guide
# describes, except for the token: instead of minting one from a private key in
# a repository secret, the job's OIDC token logs in to OpenBao under the jwt/
# role count-patchula-self, which only this workflow on main can use, and
# leases an installation token for the App (sweepies-ops) with the permissions
# the server guide lists. The token and the OpenBao session are revoked when
# the job ends.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Build the Count from this commit instead of running the latest release, to try unreleased changes before cutting a release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: patchula
  cancel-in-progress: false

jobs:
  patchula:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Logs in to OpenBao over OIDC.
      id-token: write
    # The mise settings stay on the steps that run this repository's tasks, out
    # of the Count's own environment.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED: "1"
          MISE_ENABLE_TOOLS: ${{ inputs.source && 'nu,gh,rust,mr-boxington,zig' || 'nu,gh' }}
        with:
          cache: false
      - if: inputs.source
        env:
          MISE_LOCKED: "1"
          MISE_ENABLE_TOOLS: rust,mr-boxington,zig
        run: mise run build:cli
      - name: Lease the App token
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          MISE_LOCKED: "1"
          MISE_ENABLE_TOOLS: nu,gh
          # Workflow commands (masks, GITHUB_ENV) reach the runner unprefixed.
          MISE_TASK_OUTPUT: interleave
        run: mise run openbao:lease --role count-patchula-self --github count-patchula-self:PATCHULA_APP_TOKEN
      - if: ${{ !inputs.source }}
        uses: sweepies/count-patchula@e84a7f0ad796c0733c618b22f16e6ad0eba6b179 # v0.11.1
        with:
          token: ${{ env.PATCHULA_APP_TOKEN }}
      # The action from this commit, running the binary built above.
      - if: inputs.source
        uses: $/
        with:
          token: ${{ env.PATCHULA_APP_TOKEN }}
          binary: target/release/patchula
      - name: Revoke the App token and the OpenBao session
        if: always()
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          MISE_LOCKED: "1"
          MISE_ENABLE_TOOLS: nu,gh
          # Workflow commands (masks, GITHUB_ENV) reach the runner unprefixed.
          MISE_TASK_OUTPUT: interleave
        run: mise run openbao:lease --revoke
